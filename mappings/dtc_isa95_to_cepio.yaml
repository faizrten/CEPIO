schema_version: '1.0'
source:
  name: Digital Twin Consortium ManufacturingOntologies
  repository: https://github.com/digitaltwinconsortium/ManufacturingOntologies
  commit: f6b45fc83c922177fa7590c530339c4876b677c6
  license: CC-BY-4.0
  license_url: https://creativecommons.org/licenses/by/4.0/
  standard: ISA-95 / IEC 62264
  dtdl_root: Ontologies/ISA95
  wot_root: Ontologies/ISA95-WoT
  identifier_namespace: 'dtmi:digitaltwins:isa95:'

federation_policy:
  canonical_authority: CEPIO
  source_representations: [DTDL, W3C-WoT-ThingModel]
  vendor_source_files: false
  property_object_rule:
    match_suffix: Property
    disposition: canonical_property_contract
    rationale: >-
      ISA-95 generated *Property interfaces are source-schema modeling mechanics.
      CEPIO normalizes their values into canonical datatype properties, observations,
      relationships and provenance rather than promoting each *Property model as a
      business object type.
  default_disposition: review_before_promotion

families:
  part2:
    - Material
    - OperationalLocation
    - OperationsCapability
    - OperationsDefinition
    - OperationsEvent
    - OperationsPerformance
    - OperationsRecord
    - OperationsSchedule
    - OperationsTest
    - Personnel
    - PhysicalAssetAndEquipment
    - ProcessSegment
  part4:
    - ResourceRelationship
    - WorkAlert
    - WorkCalendar
    - WorkCapability
    - WorkDefinition
    - WorkPerformance
    - WorkRecord
    - WorkSchedule
    - WorkflowSpecification

