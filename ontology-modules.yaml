schema_version: '1.1'
architecture:
  foundation: [core, lifecycle, kinetic]
  industrial_common: [industrial, asset, work_management, reliability, hse, supply, performance, workforce, agentic_operations]
  domain: [energy, process_industry, manufacturing, epcic, drilling]
  enterprise: [enterprise, commercial]
  profiles: [SEO/SATORP, AD/ARO]
contract_files:
  - ontologies/canonical_properties.ttl
property_contract: mappings/canonical_properties.yaml
modules:
  - {id: core, namespace: 'https://cepio.org/ontology/core#', version: 0.3.0, file: ontologies/core.ttl, tier: foundation, stability: stable}
  - id: lifecycle
    namespace: https://cepio.org/ontology/lifecycle#
    version: 0.2.0
    file: ontologies/lifecycle.ttl
    tier: foundation
    stability: stable
    depends_on: [{module: core, version: '>=0.2.0'}]
  - id: kinetic
    namespace: https://cepio.org/ontology/kinetic#
    version: 0.3.0
    file: ontologies/kinetic.ttl
    tier: foundation
    stability: stable
    depends_on: [{module: core, version: '>=0.3.0'}]
  - id: industrial
    namespace: https://cepio.org/ontology/industrial#
    version: 0.2.2
    file: ontologies/industrial.ttl
    tier: industrial-common
    stability: stable
    depends_on: [{module: core, version: '>=0.2.0'}]
  - id: enterprise
    namespace: https://cepio.org/ontology/enterprise#
    version: 0.2.0
    file: ontologies/enterprise.ttl
    tier: enterprise
    stability: stable
    depends_on: [{module: core, version: '>=0.2.0'}]
  - id: energy
    namespace: https://cepio.org/ontology/energy#
    version: 0.2.0
    file: ontologies/energy.ttl
    tier: domain
    stability: stable
    depends_on: [{module: core, version: '>=0.2.0'}, {module: industrial, version: '>=0.2.0'}]
  - {id: asset, namespace: 'https://cepio.org/ontology/asset#', version: 0.1.1, file: ontologies/asset.ttl, tier: industrial-common, depends_on: [{module: core}, {module: industrial}]}
  - {id: work_management, namespace: 'https://cepio.org/ontology/work#', version: 0.1.1, file: ontologies/work_management.ttl, tier: industrial-common, depends_on: [{module: core}, {module: industrial}]}
  - {id: reliability, namespace: 'https://cepio.org/ontology/reliability#', version: 0.1.2, file: ontologies/reliability.ttl, tier: industrial-common, depends_on: [{module: core}, {module: industrial}]}
  - {id: hse, namespace: 'https://cepio.org/ontology/hse#', version: 0.1.2, file: ontologies/hse.ttl, tier: industrial-common, depends_on: [{module: core}, {module: industrial}]}
  - {id: supply, namespace: 'https://cepio.org/ontology/supply#', version: 0.1.1, file: ontologies/supply.ttl, tier: industrial-common, depends_on: [{module: core}, {module: industrial}, {module: enterprise}]}
  - {id: performance, namespace: 'https://cepio.org/ontology/performance#', version: 0.1.3, file: ontologies/performance.ttl, tier: industrial-common, depends_on: [{module: core}]}
  - {id: workforce, namespace: 'https://cepio.org/ontology/workforce#', version: 0.1.3, file: ontologies/workforce.ttl, tier: industrial-common, depends_on: [{module: core}]}
  - {id: agentic_operations, namespace: 'https://cepio.org/ontology/agentic#', version: 0.1.0, file: ontologies/agentic_operations.ttl, tier: industrial-common, depends_on: [{module: core}, {module: kinetic}]}
  - {id: process_industry, namespace: 'https://cepio.org/ontology/process#', version: 0.1.6, file: ontologies/process_industry.ttl, tier: domain, depends_on: [{module: core}, {module: industrial}, {module: asset}, {module: kinetic}, {module: manufacturing, version: '>=0.1.0'}]}
  - {id: manufacturing, namespace: 'https://cepio.org/ontology/manufacturing#', version: 0.1.1, file: ontologies/manufacturing.ttl, tier: domain, stability: experimental, depends_on: [{module: core}, {module: industrial}, {module: supply}]}
  - {id: epcic, namespace: 'https://cepio.org/ontology/epcic#', version: 0.1.0, file: ontologies/epcic.ttl, tier: domain, depends_on: [{module: core}, {module: asset}, {module: lifecycle}]}
  - {id: drilling, namespace: 'https://cepio.org/ontology/drilling#', version: 0.1.2, file: ontologies/drilling.ttl, tier: domain, depends_on: [{module: core}, {module: industrial}, {module: asset}, {module: energy}]}
  - {id: commercial, namespace: 'https://cepio.org/ontology/commercial#', version: 0.1.2, file: ontologies/commercial.ttl, tier: enterprise, depends_on: [{module: core}, {module: enterprise}]}
