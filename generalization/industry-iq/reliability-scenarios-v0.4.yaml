id: reliability-industry-iq-v0.4
version: "0.4"
domain: reliability
archetype: reliability-v0.1
frozen: true
north_star: >-
  Convert shared industrial evidence into reliability decisions without copying source
  schemas, inventing unsupported facts or transferring human maintenance authority to AI.
rules:
  canonical_ontology_changes_for_scenario_pass: prohibited
  customer_specific_ontology_fork: prohibited
  source_systems_remain_authoritative: true
  evidence_bindings_are_replaceable: true
  ai_assessment_is_enterprise_fact: false
  customer_data_used_for_training: false
  ai_direct_maintenance_execution: prohibited
  synthetic_reliability_score_required: false
  recorded_common_cause_is_proven_root_cause: false
  bad_actor_ranking_requires_exposure_normalization: true
  condition_disposition_is_direct_action: false
  condition_envelopes_are_profile_or_assessment_configuration: true
  rul_estimate_is_observed_equipment_fact: false
  confidence_is_uncertainty_interval: false
  rul_interval_is_governed_pack_contract_pending_core_uncertainty_rebase: true
  maintenance_window_disposition_is_direct_action: false
scenarios:
  - id: REL-IQ-001
    title: Asset Reliability Intervention IQ
    owner: reliability
    operating_question: >-
      Given current governed equipment-condition evidence, active failure/risk context and
      maintenance work, is the asset reliability state acceptable; what evidence threatens
      continued service; and which governed maintenance intervention should be considered?
    status: executable-v0.1
    pack_id: cepio.iq.reliability.asset-intervention
    shared_semantics:
      - Equipment
      - ConditionObservation
      - FailureEvent
      - FailureMode
      - WorkOrder
      - Risk
      - Decision
  - id: REL-IQ-002
    title: Failure Pattern and Recurrence IQ
    owner: reliability
    operating_question: >-
      Which equipment and failure modes are recurring beyond expected behavior, and what
      common causal evidence should change reliability strategy?
    status: executable-v0.2
    pack_id: cepio.iq.reliability.failure-pattern-recurrence
    result_states:
      - WITHIN_EXPECTATION
      - LOCAL_RECURRENCE
      - SYSTEMIC_RECURRENCE
    governed_assessment_inputs:
      - analysis window
      - maximum expected events per equipment/failure mode
      - maximum expected events per failure mode across the assessed population
      - minimum distinct equipment for systemic recurrence
      - minimum repeated events required to surface common cause evidence
    shared_semantics:
      - Equipment
      - FailureEvent
      - FailureMode
    canonical_properties:
      - startTime
      - cause
  - id: REL-IQ-003
    title: Condition Monitoring IQ
    owner: reliability
    operating_question: >-
      Which current condition observations materially deviate from accepted operating
      condition, how significant is the deterioration, and what evidence should enter
      reliability intervention review?
    status: executable-v0.3
    pack_id: cepio.iq.reliability.condition-monitoring
    result_states:
      - NORMAL
      - ADVISORY_DEVIATION
      - MATERIAL_DEVIATION
      - CRITICAL_DEVIATION
    trend_states:
      - STABLE
      - IMPROVING
      - DETERIORATING
      - INSUFFICIENT_HISTORY
    review_dispositions:
      - MONITOR
      - INSPECTION_REVIEW
      - MAINTENANCE_REVIEW
      - RISK_REVIEW
    governed_assessment_inputs:
      - assessment time
      - monitored signal identity
      - expected unit
      - accepted normal envelope
      - advisory envelope
      - material envelope
      - maximum observation age
      - trend epsilon
    shared_semantics:
      - Equipment
      - ConditionObservation
    shared_relationships:
      - hasConditionObservation
    canonical_properties:
      - value
      - unitSymbol
      - observedAt
    boundary:
      owns: condition interpretation and deterioration assessment
      does_not_own: governed maintenance intervention selection or execution
      routes_to: REL-IQ-001
  - id: REL-IQ-004
    title: Remaining Useful Life and Maintenance Window IQ
    owner: reliability
    operating_question: >-
      What governed remaining-useful-life estimate exists for critical equipment, how current
      and uncertain is it, and does a planned maintenance window complete before the
      conservative life horizon?
    status: executable-v0.4
    pack_id: cepio.iq.reliability.rul-maintenance-window
    estimate_states:
      - CURRENT
      - EXPIRING_SOON
    window_compatibility_states:
      - WINDOW_SAFE
      - WINDOW_MARGIN_LOW
      - WINDOW_AFTER_CONSERVATIVE_HORIZON
      - NO_QUALIFIED_WINDOW
    review_dispositions:
      - MONITOR
      - PLAN_MAINTENANCE_REVIEW
      - ACCELERATE_MAINTENANCE_REVIEW
      - RISK_REVIEW
    governed_assessment_inputs:
      - assessment time
      - expected RUL unit
      - conservative lower RUL bound
      - optimistic upper RUL bound
      - estimate-expiry warning horizon
      - minimum maintenance-completion margin
      - maintenance planning horizon
    shared_semantics:
      - Equipment
      - RemainingUsefulLifeEstimate
      - WorkOrder
    shared_relationships:
      - estimatesLifeOf
      - hasWorkOrder
    canonical_properties:
      - remainingUsefulLife
      - confidence
      - unitSymbol
      - validFrom
      - validTo
      - scheduledStart
      - scheduledEnd
    boundary:
      owns: life-estimate qualification and maintenance-window compatibility assessment
      does_not_own: maintenance execution, plan revision, work deferral or safety-critical control
      uncertainty_note: >-
        Lower and upper life bounds are governed pack-contract inputs until accepted Core
        uncertainty semantics are rebased into the current runtime stack. Confidence remains
        separate from uncertainty.
  - id: REL-IQ-005
    title: Bad Actor and Fleet Reliability IQ
    owner: reliability
    operating_question: >-
      Which assets are persistent reliability bad actors after normalizing service,
      operating context and maintenance exposure, and where should engineering effort focus?
    status: planned
  - id: REL-IQ-006
    title: Maintenance Strategy IQ
    owner: reliability
    operating_question: >-
      Which equipment should remain time-based, move to condition-based maintenance or
      require redesign based on governed failure, condition and consequence evidence?
    status: planned
  - id: REL-IQ-007
    title: Maintenance Deferral IQ
    owner: shared
    operating_question: >-
      Can a planned work order be deferred within governed risk constraints and authority?
    status: reusable-existing-capability
    reuses_skill: cepio.skill.maintenance.assess-maintenance-deferral
  - id: REL-IQ-008
    title: Critical Spares Reliability IQ
    owner: shared
    operating_question: >-
      Which critical failure modes lack adequate spare coverage for the expected failure and
      maintenance horizon, and what procurement intervention is justified?
    status: planned
  - id: REL-IQ-009
    title: Inspection and Integrity IQ
    owner: reliability
    operating_question: >-
      Which inspections, damage mechanisms or integrity findings materially change current
      equipment reliability or intervention priority?
    status: planned
  - id: REL-IQ-010
    title: Production and Service Consequence IQ
    owner: shared
    operating_question: >-
      What production, service or availability consequence is exposed if the equipment
      degrades or fails, and which reliability intervention best protects value?
    status: planned
  - id: REL-IQ-011
    title: Turnaround Reliability Scope IQ
    owner: shared
    operating_question: >-
      Which reliability risks and recurring failure modes should enter turnaround scope, and
      which can remain online with governed evidence?
    status: planned
  - id: REL-IQ-012
    title: Reliability Outcome Learning IQ
    owner: reliability
    operating_question: >-
      Did the selected intervention reduce failure, downtime or risk as intended, and what
      evidence should update future reliability decisions?
    status: planned
