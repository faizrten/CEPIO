id: subsurface-petrophysics-v1-portfolio
version: "1.0"
synthetic: true
provenance:
  origin: CEPIO-authored synthetic Petrophysics portfolio fixture
  source_dataset: none
  fictional_identifiers: true
  intended_use: deterministic CEPIO persona-depth, semantic, runtime and regression testing
  construction_basis:
    - common formation-evaluation relationships among Rw, Archie parameters, saturation, cutoffs, rock-property transforms and net pay
    - multi-well consistency patterns intentionally containing method and cutoff drift
    - core-versus-log contradictions to exercise evidence reconciliation
    - model handover transformations to exercise cross-discipline lineage
    - prior-versus-posterior appraisal values to exercise belief revision
    - remaining-hydrocarbon evidence to exercise Opportunity support
  limitations:
    - not calibrated to any real field, operator, basin or commercial dataset
    - numerical values are test fixtures, not empirical industry benchmarks
    - not suitable for reserves booking, petrophysical calibration, engineering design or investment decisions
asset: {field: CEPIO-SYNTH, reservoir: R3, equivalent_interval: Zone-B}
source_capabilities:
  well_master: subsurface.well.master
  logs: subsurface.wellbore.log
  markers: subsurface.wellbore.marker
  sample_analysis: subsurface.sample.analysis
  pressure: subsurface.pressure.evidence
  interpretation: subsurface.interpretation.petrophysics
