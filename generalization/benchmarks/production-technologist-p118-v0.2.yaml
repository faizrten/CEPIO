      gas_lift_mmscfd: 2.0
      facility_backpressure_bar: 12.0
      expected_rate_bopd: 5600
      expected_uplift_bopd: 850
      estimated_drawdown_bar: 60.0
      operational_change: prohibited_without_constraint_change
  expected_recommendation:
