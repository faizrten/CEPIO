    - {id: C-GASLIFT, type: shared_resource, parameter: gas_lift_mmscfd, maximum: 1.85, hard: true}
    - {id: C-BACKPRESSURE, type: surface_operability, parameter: facility_backpressure_bar, minimum_attainable_without_reconfiguration: 14.0, hard: true}
  options:
    - id: OPT-CURRENT
      description: Maintain current operating condition.
      gas_lift_mmscfd: 1.4
      facility_backpressure_bar: 18.0
      expected_rate_bopd: 4750
      expected_uplift_bopd: 0
      estimated_drawdown_bar: 52.0
      operational_change: none
    - id: OPT-GL-18
      description: Evaluate increased gas lift to 1.8 MMscf/d within current surface backpressure.
      gas_lift_mmscfd: 1.8
      facility_backpressure_bar: 18.0
      expected_rate_bopd: 5030
      expected_uplift_bopd: 280
      estimated_drawdown_bar: 54.0
      operational_change: authorized_lift_trial_required
    - id: OPT-BP-14
      description: Coordinate surface/network operation to reduce P-118 backpressure to 14 bar without changing lift allocation.
      gas_lift_mmscfd: 1.4
