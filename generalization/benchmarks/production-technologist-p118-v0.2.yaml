      expected_uplift_bopd: 520
      estimated_drawdown_bar: 55.0
      operational_change: authorized_network_change_required
    - id: OPT-COMB-18-14
      description: Combine 1.8 MMscf/d lift gas with 14 bar surface backpressure.
      gas_lift_mmscfd: 1.8
      facility_backpressure_bar: 14.0
      expected_rate_bopd: 5440
      expected_uplift_bopd: 690
      estimated_drawdown_bar: 57.5
      operational_change: authorized_combined_trial_and_integrity_review_required
    - id: OPT-PUSH-20-12
