    statement: Sub-optimal gas-lift allocation is contributing materially to lost deliverability.
    confidence: 0.82
    supporting_evidence: [EV-P118-GL, EV-P118-RATE]
    contradictory_evidence: []
    estimated_exposure_bopd: 450
    uncertainty: medium
    falsification_test: A validated lift-performance sweep showing no meaningful rate response across the permitted lift-gas range would weaken this hypothesis.
  - id: H-NEARWELLBORE
    statement: Increased skin, scale or another near-wellbore restriction may be contributing to the remaining gap.
    confidence: 0.55
    supporting_evidence: [EV-P118-RATE, EV-P118-WC]
    contradictory_evidence: [EV-P118-BHP]
    estimated_exposure_bopd: 500
    uncertainty: high
    evidence_gap: Current downhole pressure or pressure-transient evidence is missing.
    falsification_test: Current BHP and pressure-transient evidence consistent with the prior skin and inflow relationship would materially weaken the impairment hypothesis.
  - id: H-DEPLETION
    statement: Reservoir depletion is the primary cause of the production gap.
    confidence: 0.24
    supporting_evidence: []
    contradictory_evidence: [EV-P118-BHP, EV-P118-WELLTEST]
