    personas: [refinery-economist, plant-manager, finance-controller]
    standards: [isa-95-2025, iso-20815-2026]
    capability_tags: [planning, crude-slate, yield, margin]
    terms:
      - {iri: "https://cepio.org/ontology/process#MaterialStream", kind: class}
      - {iri: "https://cepio.org/ontology/manufacturing#OperationsSchedule", kind: class}
      - {iri: "https://cepio.org/ontology/commercial#ValueAtRisk", kind: class}
