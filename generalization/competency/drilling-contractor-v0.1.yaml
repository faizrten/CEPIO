id: drilling-contractor-cq-v0.1
version: "0.1"
archetype_id: drilling-contractor-v0.1
frozen: true
questions:
  - id: DC-CQ-001
    question: Which rig is assigned to this well and drilling campaign?
    priority: critical
    personas: [drilling-superintendent, rig-manager]
    standards: [ppdm-well-status-v3, osdu-data-definitions]
    capability_tags: [identity, rig-well, campaign]
    terms:
      - {iri: "https://cepio.org/ontology/drilling#OperatingRig", kind: class}
      - {iri: "https://cepio.org/ontology/energy#Well", kind: class}
      - {iri: "https://cepio.org/ontology/drilling#DrillingCampaign", kind: class}
    edges:
      - {source: "https://cepio.org/ontology/drilling#OperatingRig", predicate: "https://cepio.org/ontology/drilling#workingOnWell", target: "https://cepio.org/ontology/energy#Well"}
      - {source: "https://cepio.org/ontology/drilling#DrillingCampaign", predicate: "https://cepio.org/ontology/drilling#campaignUsesRig", target: "https://cepio.org/ontology/drilling#OperatingRig"}

  - id: DC-CQ-002
    question: Which rig systems and equipment have open maintenance work?
    priority: critical
    personas: [rig-manager, maintenance-planner, reliability-engineer]
    standards: [iadc-drilling-manual-13]
    capability_tags: [asset-hierarchy, maintenance]
    terms:
      - {iri: "https://cepio.org/ontology/drilling#OperatingRig", kind: class}
      - {iri: "https://cepio.org/ontology/drilling#RigSystem", kind: class}
      - {iri: "https://cepio.org/ontology/drilling#DrillingEquipment", kind: class}
      - {iri: "https://cepio.org/ontology/industrial#WorkOrder", kind: class}
    edges:
      - {source: "https://cepio.org/ontology/drilling#OperatingRig", predicate: "https://cepio.org/ontology/drilling#hasRigSystem", target: "https://cepio.org/ontology/drilling#RigSystem"}
