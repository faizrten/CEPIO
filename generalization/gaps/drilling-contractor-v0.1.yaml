id: drilling-contractor-gap-triage-v0.1
version: "0.2"
archetype_id: drilling-contractor-v0.1
competency_pack_id: drilling-contractor-cq-v0.1
status: accepted
classification_policy:
  CORE: Reusable canonical semantics expected to apply across multiple Energy & Process Industry archetypes; ownership may sit in a common module such as workforce or commercial rather than core.ttl.
  DOMAIN: Canonical drilling-domain specialization that should remain source-system and customer neutral.
  PROFILE: Contractor, customer, fleet or deployment-specific semantics that should not enter canonical CEPIO modules.
  MAPPING: External taxonomy, codeset or source-system vocabulary that should be federated/mapped rather than copied into CEPIO canonical semantics.
  REJECT: The exact proposed term or relationship is redundant, misleading or over-specific; satisfy the competency through a better abstraction instead.
decisions:
  - id: GAP-DC-003-NPT-EVENT
    question_id: DC-CQ-003
    missing_semantics:
      - https://cepio.org/ontology/drilling#NonProductiveTimeEvent
    disposition: REJECT
    replacement_layer: DOMAIN
    owner_module: drilling
    standards: [iadc-ddr-plus-v2, energistics-witsml-2.1]
    rationale: NPT is more robustly represented as a productivity/time classification over drilling activity intervals and their causal downtime/failure context than as a new event type. WITSML models drilling activity with productive and planned/unplanned/downtime classification, while IADC DDR Plus provides hierarchical operational codes.
    proposed_resolution: Use the source-neutral drilling activity interval/classification abstraction and derive NPT duration from classified intervals plus causal events. Do not add NonProductiveTimeEvent solely to make the benchmark pass.
    benchmark_action: retain-v0.1-gap

  - id: GAP-DC-004-ACTIVITY-CODE
    question_id: DC-CQ-004
    missing_semantics:
      - https://cepio.org/ontology/drilling#ActivityCode
      - https://cepio.org/ontology/drilling#ActivityInterval --https://cepio.org/ontology/drilling#classifiedByActivityCode--> https://cepio.org/ontology/drilling#ActivityCode
    disposition: MAPPING
    owner_module: drilling
    standards: [iadc-ddr-plus-v2, energistics-witsml-2.1]
    rationale: IADC DDR Plus and WITSML each expose activity coding/classification schemes. CEPIO preserves canonical activity semantics while mapping external codes and code systems rather than copying those taxonomies into the canonical ontology.
    proposed_resolution: Use the canonical drill:classifiedBy relationship to drill:DrillingActivityClassification and the federation contract in mappings/drilling_activity_classifications.yaml. Do not make an external activity codeset a CEPIO canonical class hierarchy.
    benchmark_action: revise-in-next-frozen-pack

  - id: GAP-DC-005-CERTIFICATE-EQUIVALENCE
    question_id: DC-CQ-005
    missing_semantics:
      - https://cepio.org/ontology/workforce#Certification --https://cepio.org/ontology/workforce#meetsCompetencyRequirement--> https://cepio.org/ontology/workforce#CompetencyRequirement
    disposition: REJECT
    replacement_layer: CORE
    owner_module: workforce
    standards: [iadc-ksa]
    rationale: A certificate can be evidence relevant to competence but should not by itself assert that a worker meets a competency requirement. IADC KSA frames competence as demonstrable capability for a rig role.
    proposed_resolution: Use CompetencyAssessment and CompetencyEvidence against CompetencyRequirement; allow Certification to be evidence without making it logically equivalent to competence.
    benchmark_action: revise-in-next-frozen-pack

  - id: GAP-DC-009-DAYRATE
    question_id: DC-CQ-009
    missing_semantics:
      - https://cepio.org/ontology/drilling#dayRate
    disposition: REJECT
    replacement_layer: CORE
    owner_module: commercial
    standards: [iadc-model-contracts]
    rationale: Daywork/day-rate commercial structures are real drilling-contract concepts, but a currencyless drilling-only scalar does not generalize and loses amount, currency, effective period and rate basis. CEPIO already retains comm:dayRate for backward compatibility; new semantics use ContractRate plus RateBasis and existing common value/validity properties.
    proposed_resolution: Use reusable comm:ContractRate linked to a contract and comm:RateBasis, with comm:amount, comm:currency and cepio:validFrom/validTo. Do not add drill:dayRate.
    benchmark_action: revise-in-next-frozen-pack

  - id: GAP-DC-013-CAMPAIGN-READINESS-CONSTRAINT
    question_id: DC-CQ-013
    missing_semantics:
      - https://cepio.org/ontology/drilling#CampaignReadinessConstraint
    disposition: REJECT
    owner_module: none
    standards: [iadc-ksa, iadc-model-contracts]
    rationale: The question can be answered from evidence about crew competency, inventory/spares, HSE and contract obligations. A stored drilling-specific CampaignReadinessConstraint would duplicate a derived conclusion and encourage ontology bloat.
    proposed_resolution: Compute campaign readiness through a governed function/Decision over underlying evidence. Revisit a generic ReadinessAssessment or Constraint abstraction only if a second independent archetype demonstrates the same semantic need.
    benchmark_action: retain-v0.1-gap
