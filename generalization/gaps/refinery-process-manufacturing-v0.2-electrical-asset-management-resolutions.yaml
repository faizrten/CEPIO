guardrails:
  - frozen refinery competency pack v0.2 is unchanged
  - ElectricMotor and MotorControlCenter are reusable industrial-common equipment types, not process-industry classes
  - electrical hierarchy composes existing asset system and functional-location semantics rather than creating refinery-specific electrical locations
  - no asserted industrial:ElectricMotor --cepio:partOf--> industrial:Equipment benchmark shortcut is introduced; subclassing and explicit operational relationships preserve the model correctly
  - IEEE 1584 arc-flash calculations remain a risk-assessment method and mapping vocabulary, not hse:ArcFlashStudy
  - AssetCriticality is modeled as assessed Measurement semantics rather than a static label
  - AssetManagementPlan is controlled Document semantics linked to assets, risks and KPIs
  - industrial-common modules remain independent of process_industry and no reverse dependency is introduced
  - no customer/profile vocabulary is introduced

