id: drilling-contractor-persona-gap-resolutions-v0.2
version: "0.1"
archetype_id: drilling-contractor-v0.1
competency_pack_id: drilling-contractor-persona-expansion-v0.2
issue: 77
principle: The frozen persona-expansion competency pack remains unchanged; this ledger records accepted reusable semantics implemented in CEPIO while rejected direct-edge challenges remain visible until a future frozen pack tests the replacement pattern directly.
resolutions:
  - gap_id: GAP-PE-001-AUTHORITY
    question_id: DC-PE-001
    disposition: CORE
    status: implemented
    implemented_semantics:
      - https://cepio.org/ontology/workforce#AuthorityAssignment
      - https://cepio.org/ontology/workforce#authorityHolder
      - https://cepio.org/ontology/workforce#authorityForAsset
      - https://cepio.org/ontology/workforce#authorityForWork
    notes: Authority is represented as an auditable assignment distinct from crew assignment and responsibility. Temporal validity is provided by the CEPIO runtime rather than duplicated as ontology-specific date properties.

  - gap_id: GAP-PE-003-SHIFT-HANDOVER
    question_id: DC-PE-003
    disposition: CORE
    status: implemented
    implemented_semantics:
      - https://cepio.org/ontology/workforce#ShiftHandover
      - https://cepio.org/ontology/workforce#handoverFromAssignment
      - https://cepio.org/ontology/workforce#handoverToAssignment
      - https://cepio.org/ontology/workforce#handoverForActivity
      - https://cepio.org/ontology/workforce#handoverCarriesWork
    notes: Shift handover is modeled as a reusable event carrying assignment, activity and unresolved-work context across personnel changes.

  - gap_id: GAP-PE-010-AUTHORITY
    question_id: DC-PE-010
    disposition: CORE
    status: implemented
    implemented_semantics:
      - https://cepio.org/ontology/workforce#AuthorityAssignment
    notes: The same authority abstraction independently supports operator/customer authorization boundaries; the drilling-only ProgramDeviation challenge remains unresolved by design.

  - gap_id: GAP-PE-005-DIRECT-WORK-RESPONSIBILITY
    question_id: DC-PE-005
    disposition: REJECT
    status: replacement-implemented
    implemented_semantics:
      - https://cepio.org/ontology/workforce#ResponsibilityAssignment
      - https://cepio.org/ontology/workforce#responsibilityHolder
      - https://cepio.org/ontology/workforce#responsibilityForAsset
      - https://cepio.org/ontology/workforce#responsibilityForWork
    notes: The frozen direct CrewMember-to-WorkOrder edge remains intentionally absent. Future competency packs should test responsibility through the assignment pattern.

  - gap_id: GAP-PE-002-DIRECT-ACTIVITY-ASSIGNMENT
    question_id: DC-PE-002
    disposition: REJECT
    status: replacement-implemented
    implemented_semantics:
      - https://cepio.org/ontology/workforce#assignmentForActivity
    notes: The frozen direct CrewMember-to-Activity edge remains intentionally absent. Activity staffing is resolved through CrewAssignment so role and temporal context are preserved.
