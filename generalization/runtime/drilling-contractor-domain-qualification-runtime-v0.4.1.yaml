      - {id: DQ011-REC, type: "https://cepio.org/ontology/agentic#Recommendation", name: Inspect BOP Recommendation}
      - {id: DQ011-CP, type: "https://cepio.org/ontology/agentic#ControlPoint", name: Human Approval Control Point}
      - {id: DQ011-AUTH, type: "https://cepio.org/ontology/workforce#AuthorityAssignment", name: OIM Authority}
      - {id: DQ011-OIM, type: "https://cepio.org/ontology/workforce#CrewMember", name: Qualification OIM}
    relationships:
      - {id: dq011-rig-bop, type: "https://cepio.org/ontology/drilling#hasWellControlEquipment", source: DQ011-RIG, target: DQ011-BOP}
      - {id: dq011-test-bop, type: "https://cepio.org/ontology/drilling#testsWellControlEquipment", source: DQ011-TEST, target: DQ011-BOP}
      - {id: dq011-rec-bop, type: "https://cepio.org/ontology/agentic#recommendationFor", source: DQ011-REC, target: DQ011-BOP}
      - {id: dq011-rec-evidence, type: "https://cepio.org/ontology/agentic#supportedByEvidence", source: DQ011-REC, target: DQ011-TEST}
      - {id: dq011-rec-control, type: "https://cepio.org/ontology/agentic#governedAtControlPoint", source: DQ011-REC, target: DQ011-CP}
