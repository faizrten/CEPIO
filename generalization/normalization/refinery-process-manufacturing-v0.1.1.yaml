id: refinery-process-manufacturing-normalization-v0.1.1
version: "0.1.1"
source_pack: generalization/competency/refinery-process-manufacturing-v0.1.yaml
source_pack_id: refinery-process-manufacturing-capabilities-v0.1
policy:
  preserve_raw_baseline: true
  business_questions_immutable: true
  personas_immutable: true
  priorities_immutable: true
  standards_immutable: true
  ontology_changes_allowed: false
  correction_rule: Normalize only to semantics already present in CEPIO; do not weaken a genuine competency requirement to improve the score.
corrections:
  - id: canonical-process-unit
    kind: iri-replacement
    from: https://cepio.org/ontology/process#ProcessUnit
    to: https://cepio.org/ontology/industrial#ProcessUnit
    rationale: CEPIO already defines ProcessUnit canonically in the industrial module; adding a duplicate process-domain class would fragment identity.

  - id: material-stream-unit-topology
    kind: pattern-replacement
    question_id: RP-PC-001
    capability_id: process-unit-flow-context
    from: MaterialStream --process:streamFeedsUnit--> process:ProcessUnit
    to: MaterialStream --process:streamToUnit--> ind:ProcessUnit
    rationale: process:streamToUnit is the existing canonical stream topology relationship.

  - id: emission-unit-direction
    kind: pattern-replacement
    question_id: RP-PC-009
    capability_id: emissions-evidence
    from: process:ProcessUnit --cepio:measuredBy--> process:EmissionObservation
    to: process:EmissionObservation --process:emissionFromUnit--> ind:ProcessUnit
    rationale: CEPIO already models emission observations as measurements with an explicit emissionFromUnit relationship; the frozen pattern had the direction wrong.

  - id: utility-meter-scoping
    kind: pattern-replacement
    question_id: RP-PC-010
    capability_id: utility-metering
    from: process:UtilityStream --cepio:measuredBy--> process:UtilityMeter
    to:
      - process:UtilityStream --process:streamToUnit--> ind:ProcessUnit
      - process:UtilityMeter --process:meterAtUnit--> ind:ProcessUnit
    rationale: UtilityMeter is Equipment, not Measurement. Existing CEPIO semantics scope both stream and meter to the process unit without asserting a type-invalid measuredBy edge.

  - id: reuse-industrial-trip-event
    kind: pattern-replacement
    question_id: RP-PC-013
    capability_id: process-trip
    from: process:ProcessTrip --process:tripOfUnit--> process:ProcessUnit
    to: ind:TripEvent --hse:eventAtAsset--> ind:ProcessUnit
    rationale: CEPIO already has a reusable industrial TripEvent and a generic event-to-asset relationship. A refinery-only ProcessTrip class is unnecessary for this capability.

expected_effect:
  note: The normalized score must be measured by the harness. No target score is encoded here and no ontology remediation is permitted in this normalization step.
