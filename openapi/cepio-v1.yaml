openapi: 3.1.0
info:
  title: CEPIO Operational Ontology API
  version: v1
  description: Stable public CEPIO API v1 route contract. Runtime schemas are generated by FastAPI; CI verifies route, method, and operation identity against this baseline. Selected product-critical request/response semantics are recorded here explicitly.
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      responses:
        '200': {description: OK}
  /api/v1/objects:
    get:
      operationId: listObjects
      responses:
        '200': {description: OK}
  /api/v1/objects/{object_id}:
    get:
      operationId: getObject
      responses:
        '200': {description: OK}
    put:
      operationId: upsertObject
      responses:
        '200': {description: OK}
  /api/v1/query/objects:
    post:
      operationId: queryObjects
      description: Execute the typed CEPIO object query contract. Cursor continuation is opaque and authorization is applied before exposed counts, cursor positions, and page results.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                object_type: {type: [string, 'null']}
                include_subtypes: {type: boolean, default: true}
                predicates: {type: array, items: {type: object}}
                relationships: {type: array, items: {type: object}}
                valid_at: {type: [string, 'null'], format: date-time}
                as_of_transaction: {type: [string, 'null'], format: date-time}
                sort: {type: array, items: {type: object}}
                cursor:
                  type: [string, 'null']
                  description: Opaque continuation cursor returned by a previous page. Must not be combined with offset.
                include_total:
                  type: boolean
                  default: true
                  description: Set false when a full authorized result count is not required.
                offset:
                  type: integer
                  minimum: 0
                  default: 0
                  deprecated: true
                  description: Legacy compatibility pagination. Public v1 clients should use cursor.
                limit:
                  type: integer
                  minimum: 1
                  maximum: 1000
                  default: 100
      responses:
        '200':
          description: Authorized query page.
          content:
            application/json:
              schema:
                type: object
                required: [items, offset, limit, has_more]
                properties:
                  items: {type: array, items: {type: object}}
                  total: {type: [integer, 'null']}
                  offset: {type: integer}
                  limit: {type: integer}
                  next_cursor:
                    type: [string, 'null']
                    description: Opaque cursor for the next page when has_more is true.
                  has_more: {type: boolean}
        '400':
          description: Invalid or query-mismatched cursor. Stable error code `invalid_query_cursor`.
        '429':
          description: Query exceeds a configured execution/page/complexity budget. Stable error code `query_budget_exceeded`.
  /api/v1/relationships:
    post:
      operationId: addRelationship
      responses:
        '200': {description: OK}
  /api/v1/objects/{object_id}/neighbors:
    get:
      operationId: getNeighbors
      responses:
        '200': {description: OK}
  /api/v1/graph/backend:
    get:
      operationId: getGraphBackend
      responses:
        '200': {description: OK}
  /api/v1/graph/centrality:
    get:
      operationId: getGraphCentrality
      responses:
        '200': {description: OK}
  /api/v1/graph/blast-radius/{object_id}:
    get:
      operationId: getBlastRadius
      responses:
        '200': {description: OK}
  /api/v1/graph/communities:
    get:
      operationId: getGraphCommunities
      responses:
        '200': {description: OK}
  /api/v1/events:
    post:
      operationId: recordEvent
      responses:
        '200': {description: OK}
  /api/v1/objects/{object_id}/events:
    get:
      operationId: listObjectEvents
      responses:
        '200': {description: OK}
  /api/v1/skills/evaluate:
    post:
      operationId: evaluateSkill
      description: Evaluate one admitted CEPIO Skill. Caller identity and roles are derived from the authenticated host context and are never accepted in the SkillInvocation payload. The operation may persist a governed Decision but never grants or performs operational Action authority implicitly.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skill_id, subject]
              properties:
                skill_id: {type: string}
                subject:
                  type: object
                  required: [id, type]
                  properties:
                    id: {type: string}
                    type: {type: string}
                parameters: {type: object, additionalProperties: true}
                evidence: {type: array, items: {type: object}}
                assessment_refs: {type: array, items: {type: object}}
                metadata: {type: object}
      responses:
        '200':
          description: Completed, blocked, or failed SkillEvaluation from the shared CEPIO Application Contract execution path.
        '403':
          description: Host-level authorization failure outside normal Skill preflight blocking.
        '422':
          description: Request validation failure.
  /api/v1/actions:
    post:
      operationId: executeAction
      responses:
        '200': {description: OK}
  /api/v1/functions/{name}:
    post:
      operationId: callFunction
      responses:
        '200': {description: OK}
  /api/v1/decisions:
    post:
      operationId: saveDecision
      responses:
        '200': {description: OK}
  /api/v1/decisions/{decision_id}:
    get:
      operationId: getDecision
      responses:
        '200': {description: OK}
  /api/v1/audit:
    get:
      operationId: listAudit
      responses:
        '200': {description: OK}
