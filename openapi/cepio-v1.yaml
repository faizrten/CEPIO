openapi: 3.1.0
info:
  title: CEPIO Operational Ontology API
  version: v1
  description: Stable public CEPIO API v1 route contract. Runtime schemas are generated by FastAPI; CI verifies route, method, and operation identity against this baseline.
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      responses:
        '200': {description: OK}
  /api/v1/objects:
    get:
      operationId: listObjects
      responses:
        '200': {description: OK}
  /api/v1/objects/{object_id}:
    get:
      operationId: getObject
      responses:
        '200': {description: OK}
    put:
      operationId: upsertObject
      responses:
        '200': {description: OK}
  /api/v1/query/objects:
    post:
      operationId: queryObjects
      responses:
        '200': {description: OK}
  /api/v1/relationships:
    post:
      operationId: addRelationship
      responses:
        '200': {description: OK}
  /api/v1/objects/{object_id}/neighbors:
    get:
      operationId: getNeighbors
      responses:
        '200': {description: OK}
  /api/v1/graph/backend:
    get:
      operationId: getGraphBackend
      responses:
        '200': {description: OK}
  /api/v1/graph/centrality:
    get:
      operationId: getGraphCentrality
      responses:
        '200': {description: OK}
  /api/v1/graph/blast-radius/{object_id}:
    get:
      operationId: getBlastRadius
      responses:
        '200': {description: OK}
  /api/v1/graph/communities:
    get:
      operationId: getGraphCommunities
      responses:
        '200': {description: OK}
  /api/v1/events:
    post:
      operationId: recordEvent
      responses:
        '200': {description: OK}
  /api/v1/objects/{object_id}/events:
    get:
      operationId: listObjectEvents
      responses:
        '200': {description: OK}
  /api/v1/actions:
    post:
      operationId: executeAction
      responses:
        '200': {description: OK}
  /api/v1/functions/{name}:
    post:
      operationId: callFunction
      responses:
        '200': {description: OK}
  /api/v1/decisions:
    post:
      operationId: saveDecision
      responses:
        '200': {description: OK}
  /api/v1/decisions/{decision_id}:
    get:
      operationId: getDecision
      responses:
        '200': {description: OK}
  /api/v1/audit:
    get:
      operationId: listAudit
      responses:
        '200': {description: OK}
