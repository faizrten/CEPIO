policies:
  cepio_admin:
    read_types: ["*"]
    read_scopes: ["*"]
    read_properties: {}
    actions: []
    functions: ["*"]
    decisions: ["*"]
  auditor:
    read_types: ["*"]
    read_scopes: ["*"]
    read_properties: {}
    actions: []
    functions: []
    decisions: []
  graph_analyst:
    read_types: ["*"]
    read_scopes: [internal]
    read_properties: {}
    actions: []
    functions: []
    decisions: []
  petrophysicist:
    read_types:
      - https://cepio.org/ontology/subsurface#FormationEvaluationCase
      - https://cepio.org/ontology/subsurface#PetrophysicalCharacteristic
      - https://cepio.org/ontology/subsurface#FormationEvaluationState
      - https://cepio.org/ontology/core#Evidence
      - https://cepio.org/ontology/core#Assumption
      - https://cepio.org/ontology/core#UncertaintyAssessment
      - https://cepio.org/ontology/core#ConfidenceAssessment
      - https://cepio.org/ontology/core#Dependency
      - https://cepio.org/ontology/energy#Well
    read_scopes: [internal]
    read_properties: {}
    actions: []
    functions: []
    decisions: []
  operator:
    read_types: [Equipment, ProcessUnit, Measurement, KPI, Event]
    read_scopes: [internal]
    actions: []
    functions: [calculateProductionLoss, calculateProductionExposure]
    decisions: []
  maintenance_engineer:
    read_types: [Equipment, ConditionObservation, FailureMode, WorkOrder, Inspection, Event, KPI]
    read_scopes: [internal]
    read_properties:
      Equipment: "*"
      WorkOrder: "*"
      Inspection: "*"
    actions: [CreateWorkOrder, CreateInspection]
    functions: [calculateProductionLoss, calculateProductionExposure, calculateAssetRisk]
    decisions: [maintenance-intervention-recommendation]
  maintenance_planner:
    read_types: [Equipment, ConditionObservation, FailureMode, WorkOrder, Inspection, Event, KPI]
    read_scopes: [internal]
    actions: [CreateWorkOrder]
    functions: [calculateProductionLoss, calculateProductionExposure]
    decisions: [maintenance-intervention-recommendation]
  reliability_engineer:
    read_types: [Equipment, ConditionObservation, FailureMode, WorkOrder, Inspection, Event, KPI, Risk]
    read_scopes: [internal]
    read_properties:
      Equipment: "*"
    actions: [CreateInspection, EscalateRisk]
    can_recommend: [DeferWorkOrder]
    functions: [calculateProductionLoss, calculateProductionExposure, calculateAssetRisk, evaluateMaintenanceDeferralRisk, calculateMarginImpact]
    decisions: [maintenance-intervention-recommendation, maintenance-deferral-decision]
  operations_supervisor:
    read_types: [Equipment, ProcessUnit, WorkOrder, Event, KPI, Risk]
    read_scopes: [internal]
    actions: [EscalateRisk]
    functions: [calculateProductionLoss, calculateProductionExposure, calculateMarginImpact]
    decisions: []
  maintenance_manager:
    read_types: [Equipment, ConditionObservation, FailureMode, WorkOrder, Inspection, Event, KPI, Risk]
    read_scopes: [internal]
    actions: [ApproveMaintenanceDeferral, DeferWorkOrder]
    functions: [calculateProductionLoss, calculateProductionExposure, calculateAssetRisk, evaluateMaintenanceDeferralRisk, calculateMarginImpact]
    decisions: [maintenance-intervention-recommendation, maintenance-deferral-decision]
  operations_manager:
    read_types: [Equipment, ProcessUnit, WorkOrder, Event, KPI, Risk]
    read_scopes: [internal]
    actions: [ApproveMaintenanceDeferral, DeferWorkOrder]
    functions: [calculateProductionLoss, calculateProductionExposure, calculateAssetRisk, evaluateMaintenanceDeferralRisk, calculateMarginImpact]
    decisions: [maintenance-deferral-decision]
  ai_agent_recommender:
    read_types: [Equipment, ConditionObservation, FailureMode, WorkOrder, Inspection, Event, KPI, Risk]
    read_scopes: [internal]
    read_properties:
      Equipment: [criticality, operatingState, riskStatus]
      WorkOrder: [status, priority]
    actions: []
    can_recommend: [CreateWorkOrder, CreateInspection, EscalateRisk, DeferWorkOrder]
    functions: [calculateProductionLoss, calculateProductionExposure, calculateAssetRisk, evaluateMaintenanceDeferralRisk, calculateMarginImpact]
    decisions: [maintenance-intervention-recommendation, maintenance-deferral-decision]
  autonomous_control_agent:
    read_types: [Equipment, Event, State, KPI]
    read_scopes: [internal]
    actions: []
    functions: []
    decisions: []
    note: "No direct control action is permitted in v0.2. Fail closed."
  shareholder_viewer:
    read_types: [Equipment, ProcessUnit, KPI]
    read_scopes: [shareholder]
    actions: []
    functions: []
    decisions: []
  epc_partner_viewer:
    read_types: [Equipment, WorkOrder, Inspection, Event]
    read_scopes: [epc-partner]
    actions: []
    functions: []
    decisions: []
