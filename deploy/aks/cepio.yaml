apiVersion: v1
kind: Namespace
metadata:
  name: cepio
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cepio-data
  namespace: cepio
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cepio-runtime
  namespace: cepio
  annotations:
    azure.workload.identity/client-id: "REPLACE_WITH_MANAGED_IDENTITY_CLIENT_ID"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cepio-runtime
  namespace: cepio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cepio-runtime
  template:
    metadata:
      labels:
        app: cepio-runtime
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: cepio-runtime
      containers:
        - name: cepio
          image: REPLACE_WITH_CEPIO_IMAGE
          ports:
            - containerPort: 8000
          env:
            - {name: PORT, value: "8000"}
            - {name: CEPIO_ENVIRONMENT, value: "production"}
            - {name: CEPIO_DB_URL, value: "sqlite:////data/cepio.db"}
            - {name: CEPIO_AUTH_MODE, value: "entra"}
            - {name: CEPIO_ENTRA_TENANT_ID, value: "REPLACE_WITH_TENANT_ID"}
            - {name: CEPIO_ENTRA_AUDIENCE, value: "REPLACE_WITH_API_AUDIENCE"}
          volumeMounts:
            - name: cepio-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
      volumes:
        - name: cepio-data
          persistentVolumeClaim:
            claimName: cepio-data
---
apiVersion: v1
kind: Service
metadata:
  name: cepio-runtime
  namespace: cepio
spec:
  selector:
    app: cepio-runtime
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
