name: CEPIO Cognite OID Secret Handoff to Azure

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Inspect authorized Key Vault metadata, or transfer the already-proven OID_API secret'
        required: true
        default: inspect
        type: choice
        options: [inspect, handoff]

permissions:
  contents: read
  id-token: write

concurrency:
  group: cepio-cognite-oid-secret-handoff
  cancel-in-progress: false

jobs:
  keyvault:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: cognite-m0
    env:
      M0_OPERATION: ${{ inputs.operation }}
      M0_AUTH_APPROVED: ${{ vars.M0_AUTH_APPROVED }}
      M0_HANDOFF_APPROVED: ${{ vars.M0_HANDOFF_APPROVED }}
      M0_RESOURCE_GROUP: ${{ vars.M0_RESOURCE_GROUP }}
      M0_VAULT_NAME: ${{ vars.M0_KEYVAULT_NAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate protected main and exact Key Vault scope
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          [[ "$main_sha" == "$GITHUB_SHA" ]] || { echo "::error::Must use current reviewed main"; exit 1; }
          [[ "$M0_RESOURCE_GROUP" == "cepio-labs-rg" ]] || { echo "::error::Unexpected target resource group"; exit 1; }
          [[ "$M0_VAULT_NAME" == "cepiolabs-b5ufvcwpcpcdw" ]] || { echo "::error::Unexpected Key Vault"; exit 1; }
          if [[ "$M0_OPERATION" == "handoff" ]]; then
            [[ "$M0_AUTH_APPROVED" == "true" && "$M0_HANDOFF_APPROVED" == "true" ]] \
              || { echo "::error::Both approved flags are required for secret handoff"; exit 1; }
          fi
      - name: Azure login using approved GitHub environment OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Validate the vault metadata without reading secrets
        shell: bash
        run: |
          set -euo pipefail
          resource_id="$(az keyvault show --name "$M0_VAULT_NAME" \
            --resource-group "$M0_RESOURCE_GROUP" --query id --output tsv --only-show-errors)"
          [[ "$resource_id" == *"/resourceGroups/cepio-labs-rg/providers/Microsoft.KeyVault/vaults/cepiolabs-b5ufvcwpcpcdw" ]] \
            || { echo "::error::Key Vault scope validation failed"; exit 1; }
          echo "Approved existing Key Vault metadata is visible (no secret values read)."
      - name: Verify OID_API and securely transfer to Key Vault
        if: inputs.operation == 'handoff'
        env:
          OID_API: ${{ secrets.OID_API }}
        shell: bash
        run: |
          set -euo pipefail
          # Fail if credential is unavailable to the protected job.
          [[ -n "$OID_API" ]] || { echo "::error::OID_API is not in scope"; exit 1; }
          # No bearer/token/secret is printed; the source read is capped to one asset.
          python -I scripts/cognite_oid_auth_probe.py > /dev/null
          # Require secrets-list permission to protect an existing value from silent rotation.
          existing="$(az keyvault secret list --vault-name "$M0_VAULT_NAME" \
            --query "[?name=='cepio-cognite-oid-m0-client-secret'].id" \
            --output tsv --only-show-errors)"
          [[ -z "$existing" ]] || { echo "::error::Secret exists; review before any rotation"; exit 1; }
          umask 077
          secret_file="$(mktemp /dev/shm/cepio-oid-m0.XXXXXX)"
          trap 'rm -f "$secret_file"' EXIT
          printf '%s' "$OID_API" > "$secret_file"
          unset OID_API
          uri="$(az keyvault secret set \
            --vault-name "$M0_VAULT_NAME" \
            --name cepio-cognite-oid-m0-client-secret \
            --file "$secret_file" --encoding utf-8 \
            --query id --output tsv --only-show-errors)"
          rm -f "$secret_file"
          trap - EXIT
          [[ "$uri" == "https://$M0_VAULT_NAME.vault.azure.net/secrets/cepio-cognite-oid-m0-client-secret/"* ]] \
            || { echo "::error::Secret metadata response failed validation"; exit 1; }
          {
            echo "## Cognite OID M0 — Key Vault handoff"
            echo "A versioned secret was created using the approved GitHub environment."
            echo "Set the following **non-secret URI** as M0_COGNITE_SECRET_KEYVAULT_URI in the protected cognite-m0 environment:"
            echo
            echo "\`$uri\`"
            echo
            echo "No Azure Container Apps job was deployed or started."
          } >> "$GITHUB_STEP_SUMMARY"
