name: CEPIO Live Agent Challenge

on:
  push:
    branches:
      - feat/drilling-mvp-synthetic-dataset-v01
    paths:
      - 'scripts/copilot_preflight.py'
      - 'scripts/copilot_sdk_agent.py'
      - 'scripts/copilot_sdk_agent_user_token.py'
      - 'scripts/run_agent_challenge.py'
      - 'scripts/run_agent_challenge_strict.py'
      - 'mvp/benchmarks/agent-challenge-v0.1/**'
      - '.github/workflows/agent-challenge-live.yml'
  workflow_dispatch:
    inputs:
      model:
        description: GitHub Copilot model identifier
        required: false
        default: gpt-5.4
        type: string

permissions:
  contents: read

jobs:
  live-agent-challenge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CEPIO and Copilot SDK
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install github-copilot-sdk
          python -m copilot download-runtime
      - name: Verify user-scoped Copilot model access
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          COPILOT_MODEL: ${{ inputs.model || 'gpt-5.4' }}
        run: python scripts/copilot_preflight.py
      - name: Run genuine Copilot Agent Challenge
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          COPILOT_MODEL: ${{ inputs.model || 'gpt-5.4' }}
        run: |
          PYTHONPATH=src python scripts/run_agent_challenge_strict.py \
            --agent external \
            --agent-command "python scripts/copilot_sdk_agent_user_token.py" \
            --telemetry-points 600 \
            --waveform-samples 512 \
            --json-out agent-challenge-live-report.json
      - name: Publish compact result
        if: always()
        run: |
          if [ -f agent-challenge-live-report.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path('agent-challenge-live-report.json').read_text())
          print('## CEPIO Agent Challenge v0.1 — Live Copilot Model')
          print()
          print(f"- Accuracy: **{report['passed']}/{report['total']} ({report['accuracy']:.0%})**")
          print(f"- Evidence coverage: **{report['evidence_coverage']:.0%}**")
          print(f"- Unsupported claims: **{report['unsupported_claims']}**")
          print(f"- Identity accuracy: **{report.get('identity_accuracy')}**")
          print(f"- Median tool calls: **{report['median_tool_calls']:.1f}**")
          print(f"- Median latency: **{report['median_latency_ms']:.0f} ms**")
          print(f"- Semantic abstraction leakage: **{report['semantic_abstraction_leakage']}**")
          print(f"- Gate passed: **{report['gate_passed']}**")
          failed = [item['id'] for item in report['details'] if not item['passed']]
          print(f"- Failed questions: **{', '.join(failed) if failed else 'none'}**")
          PY
          else
            echo '## CEPIO Agent Challenge v0.1 — no report produced' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload challenge trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cepio-agent-challenge-live
          path: agent-challenge-live-report.json
          if-no-files-found: ignore
