name: CEPIO Cognite M0 Azure Resource Readiness

on:
  push:
    branches: [main]
    paths:
      - 'scripts/cognite_oid_azure_readiness.py'
      - '.github/workflows/cognite-oid-azure-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cepio-cognite-oid-azure-readiness
  cancel-in-progress: false

jobs:
  verify-existing-landing-zone:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: azure-demo
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Authenticate with existing CEPIO Azure OIDC identity
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Read-only visibility of existing CEPIO-Labs landing zone
        shell: bash
        run: |
          set -euo pipefail
          python -I scripts/cognite_oid_azure_readiness.py
