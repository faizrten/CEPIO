name: Drilling Domain Qualification v0.4
on:
  push:
    paths:
      - 'generalization/personas/drilling-contractor-v0.3.yaml'
      - 'generalization/competency/drilling-contractor-domain-qualification-v0.4.yaml'
      - 'generalization/standards/drilling-references.yaml'
      - 'generalization/archetypes/drilling-contractor-v0.1.yaml'
      - 'ontologies/**'
      - 'src/cepio/generalization.py'
      - 'scripts/run_generalization_harness.py'
      - 'tests/test_drilling_domain_qualification_v04.py'
      - '.github/workflows/drilling-domain-qualification-v0.4.yml'
  pull_request:
    paths:
      - 'generalization/personas/drilling-contractor-v0.3.yaml'
      - 'generalization/competency/drilling-contractor-domain-qualification-v0.4.yaml'
      - 'generalization/standards/drilling-references.yaml'
      - 'generalization/archetypes/drilling-contractor-v0.1.yaml'
      - 'ontologies/**'
      - 'src/cepio/generalization.py'
      - 'scripts/run_generalization_harness.py'
      - 'tests/test_drilling_domain_qualification_v04.py'
      - '.github/workflows/drilling-domain-qualification-v0.4.yml'

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Guard frozen v0.4 qualification contract
        run: pytest -q tests/test_drilling_domain_qualification_v04.py
      - name: Run drilling contractor domain qualification v0.4 baseline
        run: >-
          PYTHONPATH=src python scripts/run_generalization_harness.py
          --archetype generalization/archetypes/drilling-contractor-v0.1.yaml
          --competency generalization/competency/drilling-contractor-domain-qualification-v0.4.yaml
          --personas generalization/personas/drilling-contractor-v0.3.yaml
          --standards generalization/standards/drilling-references.yaml
          --skip-gap-triage
          --json-out drilling-domain-qualification-v0.4-report.json
      - name: Publish baseline summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('drilling-domain-qualification-v0.4-report.json').read_text())
          print('Drilling Contractor Domain Qualification v0.4')
          print('questions:', report['question_count'])
          print('status_counts:', report['status_counts'])
          print('semantic_check_pass_rate:', report['semantic_check_pass_rate'])
          Path('drilling-domain-qualification-v0.4-summary.txt').write_text(
              'questions: ' + str(report['question_count']) + '\n'
              + 'status_counts: ' + json.dumps(report['status_counts'], sort_keys=True) + '\n'
              + 'semantic_check_pass_rate: ' + str(report['semantic_check_pass_rate']) + '\n'
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: drilling-domain-qualification-v0.4
          path: |
            drilling-domain-qualification-v0.4-report.json
            drilling-domain-qualification-v0.4-summary.txt
