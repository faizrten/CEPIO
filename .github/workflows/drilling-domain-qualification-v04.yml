name: Drilling Domain Qualification v0.4
on:
  push:
    paths:
      - 'generalization/personas/drilling-contractor-v0.3.yaml'
      - 'generalization/competency/drilling-contractor-domain-qualification-v0.4.yaml'
      - 'generalization/standards/drilling-references.yaml'
      - 'generalization/archetypes/drilling-contractor-v0.1.yaml'
      - 'ontologies/**'
      - 'src/cepio/generalization.py'
      - 'scripts/run_generalization_harness.py'
      - 'scripts/build_drilling_domain_qualification_v041.py'
      - 'scripts/build_drilling_domain_qualification_v042.py'
      - 'tests/test_drilling_domain_qualification_v04.py'
      - 'tests/test_drilling_domain_qualification_v042.py'
      - '.github/workflows/drilling-domain-qualification-v04.yml'
  pull_request:
    paths:
      - 'generalization/personas/drilling-contractor-v0.3.yaml'
      - 'generalization/competency/drilling-contractor-domain-qualification-v0.4.yaml'
      - 'generalization/standards/drilling-references.yaml'
      - 'generalization/archetypes/drilling-contractor-v0.1.yaml'
      - 'ontologies/**'
      - 'src/cepio/generalization.py'
      - 'scripts/run_generalization_harness.py'
      - 'scripts/build_drilling_domain_qualification_v041.py'
      - 'scripts/build_drilling_domain_qualification_v042.py'
      - 'tests/test_drilling_domain_qualification_v04.py'
      - 'tests/test_drilling_domain_qualification_v042.py'
      - '.github/workflows/drilling-domain-qualification-v04.yml'

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Guard frozen v0.4 qualification contract
        run: pytest -q tests/test_drilling_domain_qualification_v04.py
      - name: Run raw drilling contractor domain qualification v0.4 baseline
        run: >-
          PYTHONPATH=src python scripts/run_generalization_harness.py
          --archetype generalization/archetypes/drilling-contractor-v0.1.yaml
          --competency generalization/competency/drilling-contractor-domain-qualification-v0.4.yaml
          --personas generalization/personas/drilling-contractor-v0.3.yaml
          --standards generalization/standards/drilling-references.yaml
          --skip-gap-triage
          --json-out drilling-domain-qualification-v0.4-report.json
      - name: Build normalized qualification benchmark v0.4.1
        run: >-
          python scripts/build_drilling_domain_qualification_v041.py
          --source generalization/competency/drilling-contractor-domain-qualification-v0.4.yaml
          --out /tmp/drilling-contractor-domain-qualification-v0.4.1.yaml
      - name: Run normalized qualification benchmark v0.4.1
        run: >-
          PYTHONPATH=src python scripts/run_generalization_harness.py
          --archetype generalization/archetypes/drilling-contractor-v0.1.yaml
          --competency /tmp/drilling-contractor-domain-qualification-v0.4.1.yaml
          --personas generalization/personas/drilling-contractor-v0.3.yaml
          --standards generalization/standards/drilling-references.yaml
          --skip-gap-triage
          --json-out drilling-domain-qualification-v0.4.1-report.json
      - name: Build cost-inclusive qualification benchmark v0.4.2
        run: >-
          PYTHONPATH=. python scripts/build_drilling_domain_qualification_v042.py
          --source generalization/competency/drilling-contractor-domain-qualification-v0.4.yaml
          --out /tmp/drilling-contractor-domain-qualification-v0.4.2.yaml
      - name: Run cost-inclusive qualification benchmark v0.4.2
        run: >-
          PYTHONPATH=src python scripts/run_generalization_harness.py
          --archetype generalization/archetypes/drilling-contractor-v0.1.yaml
          --competency /tmp/drilling-contractor-domain-qualification-v0.4.2.yaml
          --personas generalization/personas/drilling-contractor-v0.3.yaml
          --standards generalization/standards/drilling-references.yaml
          --skip-gap-triage
          --json-out drilling-domain-qualification-v0.4.2-report.json
      - name: Publish baseline summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          raw = json.loads(Path('drilling-domain-qualification-v0.4-report.json').read_text())
          normalized = json.loads(Path('drilling-domain-qualification-v0.4.1-report.json').read_text())
          cost_inclusive = json.loads(Path('drilling-domain-qualification-v0.4.2-report.json').read_text())
          print('Drilling Contractor Domain Qualification')
          print('raw v0.4:', raw['status_counts'], raw['semantic_check_pass_rate'])
          print('normalized v0.4.1:', normalized['status_counts'], normalized['semantic_check_pass_rate'])
          print('cost-inclusive v0.4.2:', cost_inclusive['status_counts'], cost_inclusive['semantic_check_pass_rate'])
          Path('drilling-domain-qualification-summary.txt').write_text(
              'raw_v0.4_status_counts: ' + json.dumps(raw['status_counts'], sort_keys=True) + '\n'
              + 'raw_v0.4_semantic_check_pass_rate: ' + str(raw['semantic_check_pass_rate']) + '\n'
              + 'normalized_v0.4.1_status_counts: ' + json.dumps(normalized['status_counts'], sort_keys=True) + '\n'
              + 'normalized_v0.4.1_semantic_check_pass_rate: ' + str(normalized['semantic_check_pass_rate']) + '\n'
              + 'cost_inclusive_v0.4.2_status_counts: ' + json.dumps(cost_inclusive['status_counts'], sort_keys=True) + '\n'
              + 'cost_inclusive_v0.4.2_semantic_check_pass_rate: ' + str(cost_inclusive['semantic_check_pass_rate']) + '\n'
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: drilling-domain-qualification-v0.4
          path: |
            drilling-domain-qualification-v0.4-report.json
            drilling-domain-qualification-v0.4.1-report.json
            drilling-domain-qualification-v0.4.2-report.json
            drilling-domain-qualification-summary.txt
