name: Temporary Drilling Testbed Formatter

on:
  push:
    branches:
      - promote/drilling-multimodal-v02

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ruff==0.14.0
      - name: Format touched Python exactly as quality gate expects
        run: |
          ruff format \
            scripts/copilot_sdk_agent.py \
            scripts/extend_drilling_mvp_multimodal_v02.py \
            scripts/generate_drilling_mvp_dataset.py \
            scripts/github_models_agent.py \
            scripts/run_drilling_mvp_acceptance.py \
            scripts/run_drilling_mvp_blind_ask.py \
            src/cepio/agent_retrieval.py \
            tests/test_agent_retrieval.py \
            tests/test_drilling_mvp_dataset.py \
            tests/test_drilling_mvp_multimodal_v02.py \
            tests/test_drilling_mvp_runtime_acceptance.py
          mkdir -p formatted-source
          cp --parents \
            scripts/copilot_sdk_agent.py \
            scripts/extend_drilling_mvp_multimodal_v02.py \
            scripts/generate_drilling_mvp_dataset.py \
            scripts/github_models_agent.py \
            scripts/run_drilling_mvp_acceptance.py \
            scripts/run_drilling_mvp_blind_ask.py \
            src/cepio/agent_retrieval.py \
            tests/test_agent_retrieval.py \
            tests/test_drilling_mvp_dataset.py \
            tests/test_drilling_mvp_multimodal_v02.py \
            tests/test_drilling_mvp_runtime_acceptance.py \
            formatted-source/
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-drilling-testbed-source
          path: formatted-source/
          if-no-files-found: error
