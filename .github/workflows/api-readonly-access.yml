name: CEPIO API Read-only Access Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: azure-demo
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Sign in with existing deployment identity
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Inspect startup and anonymous protocol boundaries without changes
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APP_NAME" == "cepio-demo-31d48" && -n "$RESOURCE_GROUP" ]]
          az webapp config show --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" \
            --query '{appCommandLine:appCommandLine,linuxFxVersion:linuxFxVersion}' \
            --output json > "$RUNNER_TEMP/cepio-host-config.json"
          python3 scripts/check_hosted_boundary.py \
            --startup-config "$RUNNER_TEMP/cepio-host-config.json" \
            --base-url https://cepio-demo-31d48.azurewebsites.net
          python3 - <<'PYTHON'
          import json, os, re
          from pathlib import Path
          config = json.loads((Path(os.environ["RUNNER_TEMP"]) / "cepio-host-config.json").read_text())
          image = config.get("linuxFxVersion", "")
          if not re.fullmatch(r"DOCKER\|cepiodemo31d48[.]azurecr[.]io/cepio@sha256:[0-9a-f]{64}", image):
              raise SystemExit("Unexpected image reference; inspect privately")
          print("Configured immutable image: " + image)
          PYTHON

      - name: Check authenticated API without mutations
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import urllib.error
          import urllib.request

          def stop(code):
              print("::error::" + code)
              raise SystemExit(1)

          def az(*args):
              result = subprocess.run(
                  ["az", *args, "--output", "json", "--only-show-errors"],
                  capture_output=True, text=True, timeout=45,
              )
              if result.returncode:
                  stop("AZURE_READ_OR_TOKEN_DENIED: inspect identity permissions; no grants changed")
              try:
                  return json.loads(result.stdout)
              except ValueError:
                  stop("INVALID_AZURE_RESPONSE")

          group, app = os.environ["RESOURCE_GROUP"], os.environ["APP_NAME"]
          if app != "cepio-demo-31d48" or not group:
              stop("UNEXPECTED_TARGET")
          host = az("webapp", "show", "--resource-group", group, "--name", app,
                    "--query", "defaultHostName")
          if host != "cepio-demo-31d48.azurewebsites.net":
              stop("UNEXPECTED_HOST")
          audience = az(
              "webapp", "config", "appsettings", "list",
              "--resource-group", group, "--name", app,
              "--query", "[?name=='CEPIO_ENTRA_AUDIENCE'].value | [0]",
          )
          if not isinstance(audience, str) or not audience.strip():
              stop("CEPIO_AUDIENCE_MISSING")
          # GUID audiences use the conventional api:// App ID URI.
          # Custom App ID URIs are used exactly; no guessed identity fallback.
          resource = "api://" + audience if re.fullmatch(
              r"[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}", audience
          ) else audience
          token = az("account", "get-access-token", "--resource", resource,
                     "--query", "accessToken")
          if not isinstance(token, str) or not token:
              stop("TOKEN_MISSING")
          # Tokens and response bodies never enter logs, artifacts or outputs.
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect())
          results = []
          for path in ("/api/v1/objects", "/management/v1/health"):
              request = urllib.request.Request(
                  "https://" + host + path,
                  headers={"Authorization": "Bearer " + token,
                           "X-Request-ID": "api-access-" + os.environ["GITHUB_RUN_ID"]},
              )
              try:
                  with opener.open(request, timeout=30) as response:
                      status = response.status
              except urllib.error.HTTPError as error:
                  status = error.code
              except (urllib.error.URLError, TimeoutError):
                  stop("API_TRANSPORT_FAILED")
              results.append((path, status))
              print(path + ": HTTP " + str(status))
          # Protocol metadata only: no tools/call, model, Action or dataset query.
          headers = {"Authorization": "Bearer " + token,
                     "Content-Type": "application/json",
                     "Accept": "application/json, text/event-stream"}
          def mcp_request(method, params, request_id):
              request = urllib.request.Request(
                  "https://" + host + "/mcp",
                  data=json.dumps({"jsonrpc": "2.0", "id": request_id,
                                   "method": method, "params": params}).encode(),
                  headers=headers,
              )
              try:
                  with opener.open(request, timeout=30) as response:
                      payload = json.loads(response.read(262144))
              except (urllib.error.URLError, TimeoutError, ValueError):
                  stop("MCP_AUTHENTICATED_PROTOCOL_NOT_QUALIFIED")
              if not isinstance(payload, dict) or "error" in payload or "result" not in payload:
                  stop("MCP_PROTOCOL_RESULT_MISSING")
              return payload["result"]

          initialized = mcp_request("initialize", {
              "protocolVersion": "2025-03-26", "capabilities": {},
              "clientInfo": {"name": "cepio-readonly-proof", "version": "1"},
          }, 1)
          if not isinstance(initialized, dict) or not isinstance(initialized.get("protocolVersion"), str):
              stop("MCP_INITIALIZATION_NOT_QUALIFIED")
          headers["MCP-Protocol-Version"] = initialized["protocolVersion"]
          listed = mcp_request("tools/list", {}, 2)
          if not isinstance(listed, dict) or not isinstance(listed.get("tools"), list) or not listed["tools"]:
              stop("MCP_TOOL_CATALOG_NOT_QUALIFIED")
          print("Authenticated MCP initialize and tools/list: PASS (no tools invoked)")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Read-only CEPIO API access\n")
              for path, status in results:
                  summary.write("- " + path + ": HTTP " + str(status) + "\n")
              summary.write("- Authenticated MCP initialize and tools/list: PASS (no tools invoked)\n")
              summary.write("\nNo model calls, Actions, deployment changes or permission grants.\n")
              summary.write("HTTP 200 on objects proves request access, not complete dataset visibility or scenario qualification.\n")
          if any(status != 200 for path, status in results):
              stop("APPLICATION_API_ACCESS_NOT_QUALIFIED")
          PY
