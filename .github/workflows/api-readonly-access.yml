name: CEPIO API Read-only Access Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: azure-demo
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Sign in with existing deployment identity
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Check authenticated API without mutations
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import urllib.error
          import urllib.request

          def stop(code):
              print("::error::" + code)
              raise SystemExit(1)

          def az(*args):
              result = subprocess.run(
                  ["az", *args, "--output", "json", "--only-show-errors"],
                  capture_output=True, text=True, timeout=45,
              )
              if result.returncode:
                  stop("AZURE_READ_OR_TOKEN_DENIED: inspect identity permissions; no grants changed")
              try:
                  return json.loads(result.stdout)
              except ValueError:
                  stop("INVALID_AZURE_RESPONSE")

          group, app = os.environ["RESOURCE_GROUP"], os.environ["APP_NAME"]
          if app != "cepio-demo-31d48" or not group:
              stop("UNEXPECTED_TARGET")
          host = az("webapp", "show", "--resource-group", group, "--name", app,
                    "--query", "defaultHostName")
          if host != "cepio-demo-31d48.azurewebsites.net":
              stop("UNEXPECTED_HOST")
          audience = az(
              "webapp", "config", "appsettings", "list",
              "--resource-group", group, "--name", app,
              "--query", "[?name=='CEPIO_ENTRA_AUDIENCE'].value | [0]",
          )
          if not isinstance(audience, str) or not audience.strip():
              stop("CEPIO_AUDIENCE_MISSING")
          # GUID audiences use the conventional api:// App ID URI.
          # Custom App ID URIs are used exactly; no guessed identity fallback.
          resource = "api://" + audience if re.fullmatch(
              r"[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}", audience
          ) else audience
          token = az("account", "get-access-token", "--resource", resource,
                     "--query", "accessToken")
          if not isinstance(token, str) or not token:
              stop("TOKEN_MISSING")
          # Tokens and response bodies never enter logs, artifacts or outputs.
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect())
          results = []
          for path in ("/api/v1/objects", "/management/v1/health"):
              request = urllib.request.Request(
                  "https://" + host + path,
                  headers={"Authorization": "Bearer " + token,
                           "X-Request-ID": "api-access-" + os.environ["GITHUB_RUN_ID"]},
              )
              try:
                  with opener.open(request, timeout=30) as response:
                      status = response.status
              except urllib.error.HTTPError as error:
                  status = error.code
              except (urllib.error.URLError, TimeoutError):
                  stop("API_TRANSPORT_FAILED")
              results.append((path, status))
              print(path + ": HTTP " + str(status))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Read-only CEPIO API access\n")
              for path, status in results:
                  summary.write("- " + path + ": HTTP " + str(status) + "\n")
              summary.write("\nNo model calls, Actions, deployment changes or permission grants.\n")
              summary.write("HTTP 200 on objects proves request access, not complete dataset visibility or scenario qualification.\n")
          if results[0][1] != 200:
              stop("APPLICATION_API_ACCESS_NOT_QUALIFIED")
          PY
