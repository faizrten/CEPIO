name: Temporary Runtime Format Diagnostic

on:
  push:
    branches:
      - promote/drilling-domain-runtime-qualification-v041

permissions:
  contents: read

jobs:
  ruff-format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ruff==0.14.0
      - name: Show exact formatter diff
        run: >-
          ruff format --diff
          src/cepio/qualification_assurance.py
          tests/test_drilling_domain_runtime_qualification_v041.py
