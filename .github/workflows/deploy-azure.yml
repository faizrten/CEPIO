name: Deploy CEPIO to Azure

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed main commit to deploy; production remains HOLD until separately authorized
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cepio-azure-demo
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      needs.validate.result == 'success'
    runs-on: ubuntu-latest
    environment: azure-demo
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_SHA: ${{ inputs.source_sha }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
      AZURE_CONTAINER_REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Reject superseded commits
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Expected a full reviewed commit SHA."; exit 1; }
          checked_out_sha="$(git rev-parse HEAD)"
          main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$checked_out_sha" != "$DEPLOY_SHA" || "$main_sha" != "$DEPLOY_SHA" || "$GITHUB_SHA" != "$DEPLOY_SHA" ]]; then
            echo "::error::Requested commit must match the dispatched, validated and current main commit."
            exit 1
          fi

      - name: Sign in to Azure using OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1, matches deploy-dev.yml
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify hosted startup before deployment
        shell: bash
        run: |
          set -euo pipefail
          az webapp config show --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --query '{appCommandLine:appCommandLine,linuxFxVersion:linuxFxVersion}' \
            --output json > "$RUNNER_TEMP/cepio-host-config.json"
          python3 scripts/check_hosted_boundary.py --startup-config "$RUNNER_TEMP/cepio-host-config.json"

      - name: Install checksum-pinned provenance verifier
        run: python3 scripts/install_cosign.py

      - name: Build, sign and verify exact private image
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/build_demo_image.py

      - uses: actions/upload-artifact@v4
        with:
          name: cepio-image-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cepio-provenance/
          if-no-files-found: error
          retention-days: 90

      - name: Deploy immutable image
        shell: bash
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          REGISTRY_SERVER: ${{ steps.build.outputs.server }}
        run: |
          set -euo pipefail
          az webapp config container set \
            --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" \
            --container-image-name "$IMAGE" \
            --container-registry-url "https://$REGISTRY_SERVER" --output none
          # Clear legacy Search settings; do not touch other App Service configuration.
          az webapp config appsettings delete \
            --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" \
            --setting-names CEPIO_AZURE_SEARCH_ENDPOINT CEPIO_AZURE_SEARCH_INDEX \
            --output none
          az webapp restart --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME"
          configured="$(az webapp config show --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" --query linuxFxVersion --output tsv)"
          if [[ "$configured" != "DOCKER|$IMAGE" ]]; then
            echo "::error::App Service image configuration does not match the built digest."
            exit 1
          fi

      - name: Check health and authentication boundary
        shell: bash
        run: |
          set -euo pipefail
          host="$(az webapp show --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" --query defaultHostName --output tsv)"
          python3 scripts/check_hosted_boundary.py --base-url "https://$host"
          {
            echo "### CEPIO demo deployment"
            echo "- Commit: $DEPLOY_SHA"
            echo "- REST: https://$host/api/v1"
            echo "- Management: https://$host/management/v1 (authenticated read-only)"
            echo "- MCP: https://$host/mcp (authenticated Streamable HTTP)"
            echo "- Image: ${{ steps.build.outputs.image }}"
            echo "- Anonymous object access: HTTP 401"
            echo "- Anonymous management access: HTTP 401"
            echo "- Anonymous MCP access: HTTP 401"
          } >> "$GITHUB_STEP_SUMMARY"
