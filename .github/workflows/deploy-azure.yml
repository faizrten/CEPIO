name: Deploy CEPIO to Azure

on:
  workflow_run:
    workflows: ["CEPIO CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cepio-azure-demo
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: azure-demo
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
      AZURE_CONTAINER_REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Reject superseded commits
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$main_sha" != "$DEPLOY_SHA" ]]; then
            echo "::error::This commit is no longer main. Approve the latest successful CI deployment instead."
            exit 1
          fi

      - name: Sign in to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build private container image
        id: build
        shell: bash
        run: |
          set -euo pipefail
          tag="cepio:${DEPLOY_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          az acr build --registry "$AZURE_CONTAINER_REGISTRY" \
            --image "$tag" --file Dockerfile --no-logs .
          digest="$(az acr repository show --name "$AZURE_CONTAINER_REGISTRY" \
            --image "$tag" --query digest --output tsv)"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Registry did not return a valid image digest."
            exit 1
          fi
          server="$(az acr show --name "$AZURE_CONTAINER_REGISTRY" --query loginServer --output tsv)"
          echo "image=${server}/cepio@${digest}" >> "$GITHUB_OUTPUT"
          echo "server=$server" >> "$GITHUB_OUTPUT"

      - name: Deploy immutable image
        shell: bash
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          REGISTRY_SERVER: ${{ steps.build.outputs.server }}
        run: |
          set -euo pipefail
          az webapp config container set \
            --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" \
            --container-image-name "$IMAGE" \
            --container-registry-url "https://$REGISTRY_SERVER" --output none
          az webapp restart --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME"
          configured="$(az webapp config show --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" --query linuxFxVersion --output tsv)"
          if [[ "$configured" != "DOCKER|$IMAGE" ]]; then
            echo "::error::App Service image configuration does not match the built digest."
            exit 1
          fi

      - name: Check health and authentication boundary
        shell: bash
        run: |
          set -euo pipefail
          host="$(az webapp show --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" --query defaultHostName --output tsv)"
          health="$(curl --fail --silent --show-error --retry 12 --retry-delay 10 \
            --retry-all-errors --max-time 30 "https://$host/api/v1/health")"
          echo "$health" | python3 -c 'import json, sys; data = json.load(sys.stdin); sys.exit(0 if data.get("status") == "ok" else 1)'
          status="$(curl --silent --show-error --max-time 30 --output /dev/null \
            --write-out '%{http_code}' "https://$host/api/v1/objects")"
          if [[ "$status" != "401" ]]; then
            echo "::error::Expected unauthenticated object reads to return 401, got $status."
            exit 1
          fi
          {
            echo "### CEPIO demo deployment"
            echo "- Commit: $DEPLOY_SHA"
            echo "- Health: https://$host/api/v1/health"
            echo "- Image: ${{ steps.build.outputs.image }}"
            echo "- Anonymous object access: HTTP 401"
          } >> "$GITHUB_STEP_SUMMARY"
