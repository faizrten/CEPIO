name: CEPIO Governance

on:
  pull_request:
    branches:
      - main
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  governance:
    name: governance
    runs-on: ubuntu-latest
    steps:
      - name: Verify docs-only eligibility from the PR file list
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo, pull_number: context.issue.number, per_page: 100
            });
            const docsOnly = files.length > 0 && files.length < 3000 && files.every(file =>
              file.status !== 'removed' && !file.previous_filename &&
              /^(?:README\.md|docs\/(?!adr\/|governance\/)[^/].*)$/.test(file.filename)
            );
            core.exportVariable('CEPIO_DOCS_ONLY', String(docsOnly));
      - name: Validate pull request governance metadata
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys

          with open(os.environ["GITHUB_EVENT_PATH"], "r", encoding="utf-8") as f:
              event = json.load(f)

          pr = event.get("pull_request", {})
          body = pr.get("body") or ""
          title = pr.get("title") or ""

          # Only proven docs-only PRs with an explicitly selected LOW risk
          # may use the small solo-founder template. Any code, rename, deletion,
          # unknown path, or higher risk retains all original requirements.
          streamlined = (
              os.environ.get("CEPIO_DOCS_ONLY") == "true"
              and bool(re.search(r"(?m)^- \[[xX]\] low\s*$", body))
          )
          required_headings = ([
              "## Summary",
              "## Risk classification",
              "## IP / publication review",
          ] if streamlined else [
              "## Linked issue",
              "## Change class",
              "## Architecture / semantic impact",
              "## Validation",
              "## IP / publication review",
              "## Documentation impact",
              "## Breaking changes / migration",
          ])

          failures = []
          for heading in required_headings:
              if heading not in body:
                  failures.append(f"Missing required PR section: {heading}")

          issue_ref = re.search(r"(?im)^\s*(?:closes|fixes|refs|references)\s+#\d+\b", body)
          explicit_na = re.search(r"(?im)^\s*N/A\s*[—-]\s*.+$", body)
          if not streamlined and not issue_ref and not explicit_na:
              failures.append(
                  "Linked issue must contain 'Closes #<n>', 'Fixes #<n>', 'Refs #<n>', "
                  "or an explicit 'N/A — <reason>'."
              )

          change_class_block = re.search(
              r"## Change class(?P<section>.*?)(?=\n## |\Z)",
              body,
              flags=re.IGNORECASE | re.DOTALL,
          )
          if not streamlined and change_class_block and not re.search(r"(?m)^\s*- \[[xX]\] ", change_class_block.group("section")):
              failures.append("Select at least one Change class checkbox.")

          if streamlined:
              summary_section = re.search(r"## Summary\s*\n(?P<text>.*?)(?=\n## |\Z)", body, re.DOTALL)
              if not summary_section or len(summary_section.group("text").strip()) < 20:
                  failures.append("Docs-only PR requires a meaningful 20+ character summary.")

          if title.lower().startswith("wip"):
              failures.append("PR title must not start with WIP; use GitHub Draft PR state instead.")

          if failures:
              print("CEPIO governance check failed:\n")
              for failure in failures:
                  print(f"- {failure}")
              sys.exit(1)

          print("CEPIO governance metadata check passed.")
          PY
