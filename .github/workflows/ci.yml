name: CEPIO CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - name: Query pushdown load baseline
        run: PYTHONPATH=src python scripts/query_load_baseline.py --objects 5000 --max-ms 5000
      - name: Validate deployment profiles
        run: PYTHONPATH=src python scripts/validate_deployment_profiles.py
      - name: Validate public API contract
        run: PYTHONPATH=src python scripts/check_api_contract.py
      - name: Validate Python and TypeScript clients against API v1
        run: PYTHONPATH=src python scripts/check_client_contract.py
      - name: Validate ontology compatibility
        run: PYTHONPATH=src python scripts/check_ontology_compat.py --json-report compatibility-report.json
      - name: Run drilling generalization harness v0.1
        run: PYTHONPATH=src python scripts/run_generalization_harness.py --json-out generalization-report.json
      - name: Run drilling persona expansion harness v0.2 with gap triage
        run: >-
          PYTHONPATH=src python scripts/run_generalization_harness.py
          --competency generalization/competency/drilling-contractor-persona-expansion-v0.2.yaml
          --personas generalization/personas/drilling-contractor-v0.2.yaml
          --gaps generalization/gaps/drilling-contractor-persona-v0.2.yaml
          --json-out generalization-persona-v0.2-report.json
      - name: Run drilling capability harness v0.3
        run: >-
          PYTHONPATH=src python scripts/run_generalization_harness.py
          --competency generalization/competency/drilling-contractor-persona-capabilities-v0.3.yaml
          --personas generalization/personas/drilling-contractor-v0.2.yaml
          --skip-gap-triage
          --fail-on-critical-gap
          --json-out generalization-persona-v0.3-report.json
      - name: Run drilling operational assurance v0.4
        run: >-
          PYTHONPATH=src python scripts/run_operational_assurance.py
          --fail-on-gap
          --json-out operational-assurance-v0.4-report.json
      - name: Run drilling full runtime coverage v0.5
        run: >-
          PYTHONPATH=src python scripts/run_runtime_coverage.py
          --fail-on-gap
          --json-out runtime-coverage-v0.5-report.json
      - name: Run drilling domain runtime qualification v0.4.1
        run: >-
          PYTHONPATH=src python scripts/run_runtime_coverage.py
          --suite generalization/runtime/drilling-contractor-domain-qualification-runtime-v0.4.1.yaml
          --fail-on-gap
          --json-out drilling-domain-runtime-qualification-v0.4.1-report.json
      - name: Run drilling domain fail-closed assurance v0.4.1
        run: >-
          pytest -q tests/test_drilling_domain_runtime_qualification_v041.py
          -k 'stale_prediction or recommendation_without or plan_revision_requires or value_realization_requires'
      - name: Run drilling cross-customer qualification v0.5
        run: >-
          PYTHONPATH=src python scripts/run_cross_customer_qualification.py
          --fail-on-gap
          --json-out drilling-cross-customer-qualification-v0.5-report.json
      - name: Run refinery/process-manufacturing frozen baseline v0.1
        run: >-
          PYTHONPATH=src python scripts/run_generalization_harness.py
          --archetype generalization/archetypes/refinery-process-manufacturing-v0.1.yaml
          --competency generalization/competency/refinery-process-manufacturing-v0.1.yaml
          --personas generalization/personas/refinery-process-manufacturing-v0.1.yaml
          --standards generalization/standards/refinery-process-references.yaml
          --skip-gap-triage
          --json-out refinery-generalization-v0.1-report.json
      - name: Build normalized refinery benchmark v0.1.1
        run: >-
          python scripts/build_refinery_normalized_benchmark.py
          --source generalization/competency/refinery-process-manufacturing-v0.1.yaml
          --out /tmp/refinery-process-manufacturing-v0.1.1.yaml
      - name: Run normalized refinery benchmark v0.1.1
        run: >-
          PYTHONPATH=src python scripts/run_generalization_harness.py
          --archetype generalization/archetypes/refinery-process-manufacturing-v0.1.yaml
          --competency /tmp/refinery-process-manufacturing-v0.1.1.yaml
          --personas generalization/personas/refinery-process-manufacturing-v0.1.yaml
          --standards generalization/standards/refinery-process-references.yaml
          --skip-gap-triage
          --json-out refinery-generalization-v0.1.1-report.json
      - run: make validate
      - run: PYTHONPATH=src python examples/demo.py
      - name: Build wheel
        run: python -m build --wheel
      - name: Smoke test installed wheel outside repository
        shell: bash
        run: |
          python -m venv /tmp/cepio-wheel-venv
          /tmp/cepio-wheel-venv/bin/python -m pip install --upgrade pip
          /tmp/cepio-wheel-venv/bin/python -m pip install dist/cepio-*.whl
          cd /tmp
          CEPIO_ENVIRONMENT=test CEPIO_DB_URL=memory:// CEPIO_PROFILES=satorp /tmp/cepio-wheel-venv/bin/python - <<'PY'
          import cepio
          from cepio.bootstrap import build_runtime_from_settings
          from cepio.resource_paths import resolve_resource_root

          root = resolve_resource_root()
          assert cepio.__version__ == "0.4.0"
          assert (root / "ontology-modules.yaml").exists()
          assert (root / "ontologies").is_dir()
          assert (root / "profiles" / "satorp" / "profile.yaml").exists()
          runtime = build_runtime_from_settings()
          assert runtime.module_catalogue.modules
          assert runtime.profile_versions == {"satorp": "0.1.0"}
          assert runtime.type_registry.is_declared_type("https://cepio.org/profile/satorp#AmiralAsset")
          print(cepio.__version__)
          print(root)
          print(runtime.profile_versions)
          PY
      - name: Build Developer Preview container
        run: docker build -t cepio:ci .
      - name: Smoke test container outside Python checkout
        shell: bash
        run: |
          cid=$(docker run -d \
            -p 18000:8000 \
            -e CEPIO_ENVIRONMENT=test \
            -e CEPIO_DB_URL=memory:// \
            -e CEPIO_AUTH_MODE=dev \
            cepio:ci)
          trap 'docker logs "$cid" || true; docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          healthy=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18000/api/v1/health > /tmp/cepio-health.json; then
              healthy=1
              break
            fi
            sleep 1
          done
          cat /tmp/cepio-health.json 2>/dev/null || true
          test "$healthy" -eq 1