name: CEPIO CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - run: PYTHONPATH=src python scripts/check_ontology_compat.py --json-report compatibility-report.json
      - run: make validate
      - run: PYTHONPATH=src python examples/demo.py
