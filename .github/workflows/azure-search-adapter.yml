name: CEPIO Azure AI Search Adapter

on:
  pull_request:
    paths:
      - "src/cepio/azure_search.py"
      - "tests/test_azure_search_adapter.py"
      - "pyproject.toml"
      - "Dockerfile"
      - "deploy/appservice/main.bicep"
      - ".github/workflows/deploy-azure.yml"
      - ".github/workflows/azure-search-adapter.yml"
  push:
    branches: [main]
    paths:
      - "src/cepio/azure_search.py"
      - "tests/test_azure_search_adapter.py"
      - "pyproject.toml"
      - "Dockerfile"
      - "deploy/appservice/main.bicep"
      - ".github/workflows/deploy-azure.yml"
      - ".github/workflows/azure-search-adapter.yml"

permissions:
  contents: read

jobs:
  azure-search-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_azure_search_adapter.py
