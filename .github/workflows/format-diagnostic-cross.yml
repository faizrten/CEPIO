name: Temporary Cross-Customer Format Diagnostic

on:
  push:
    branches:
      - promote/drilling-cross-customer-qualification-v05

permissions:
  contents: read

jobs:
  ruff-format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ruff==0.14.0
      - name: Show exact formatter diff
        run: >-
          ruff format --diff
          scripts/run_cross_customer_qualification.py
          src/cepio/cross_customer_qualification.py
          tests/test_drilling_cross_customer_qualification_v05.py
