name: CEPIO Azure AI Search Scale Qualification

on:
  workflow_dispatch:
    inputs:
      corpus_sizes:
        description: "Comma-separated synthetic corpus sizes"
        required: true
        default: "5000,50000"

permissions:
  contents: read

jobs:
  qualify:
    concurrency:
      group: azure-search-dev-scale-qualification
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: azure-demo
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    env:
      CEPIO_AZURE_SEARCH_ENDPOINT: https://cepio-search-dev-31d48.search.windows.net
      CEPIO_AZURE_SEARCH_INDEX: cepio-memory-v1
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure using OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install CEPIO Azure Search adapter
        run: python -m pip install -e '.[azure-search]'

      - name: Run synthetic scale qualification
        shell: bash
        env:
          CORPUS_SIZES: ${{ inputs.corpus_sizes }}
        run: |
          set -euo pipefail
          IFS=',' read -ra sizes <<< "$CORPUS_SIZES"
          python scripts/run_azure_search_scale_qualification.py \
            --endpoint "$CEPIO_AZURE_SEARCH_ENDPOINT" \
            --index "$CEPIO_AZURE_SEARCH_INDEX" \
            --reset-index \
            --batch-size 100 \
            --batch-delay-seconds 0.5 \
            --max-corpus-size 50000 \
            --sizes "${sizes[@]}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: azure-search-scale-qualification
          path: evidence/azure-search-scale-qualification.json
          if-no-files-found: warn
