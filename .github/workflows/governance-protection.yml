name: CEPIO Governance Protection
on:
  pull_request_target:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read
jobs:
  protection:
    name: governance-protection
    runs-on: ubuntu-latest
    steps:
      # Trusted base workflow only. Never check out or execute the PR head here.
      - uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo, pull_number: pr.number, per_page: 100
            });
            if (files.length >= 3000) core.setFailed('PR exceeds file-list API limit; split the PR.');
            const section = (heading) => {
              const escaped = heading.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              return (body.match(new RegExp('^## ' + escaped + '\\s*\\n([\\s\\S]*?)(?=^## |$(?![\\s\\S]))', 'm')) || [])[1] || '';
            };
            const risk = section('Risk classification');
            if ((risk.match(/^- \[[xX]\] (low|medium|high)\b/gm) || []).length !== 1) {
              core.setFailed('Select exactly one risk: low, medium, high.');
            }
            if (/^- \[[xX]\].*CUSTOMER CONFIDENTIAL/im.test(body)) {
              core.setFailed('Customer-confidential publication is prohibited.');
            }
            const sensitive = /^(\.github\/|quality\/|requirements-quality\.txt$|pyproject\.toml$|scripts\/check_|tests\/test_(architecture_invariants|quality_governance)|compatibility\/|ontologies\/|openapi\/|policies\/|src\/cepio\/(auth|policy|contextual_policy|external_actions|kinetic|repositories|temporal|provenance)|docs\/governance\/)/;
            const changed = files.flatMap(f => [f.filename, f.previous_filename].filter(Boolean));
            const protectedPaths = changed.filter(path => sensitive.test(path));
            if (protectedPaths.length) {
              if (!/^- \[[xX]\] high\b/m.test(risk)) core.setFailed('Protected paths require high risk classification.');
              const explanation = section('Governance changes').trim();
              if (explanation.length < 80 || !/^- \[[xX]\] Existing gates remain enforced\./m.test(explanation)) {
                core.setFailed('Explain protected-path changes (80+ characters) and confirm existing gates remain enforced.');
              }
              if (!files.some(f => /^docs\/adr\/ADR-\d+.*\.md$/.test(f.filename) && f.status !== 'removed')) {
                core.setFailed('Protected-path changes require a new or updated ADR documenting rationale and validation.');
              }
              core.summary.addHeading('Protected governance changes').addList(protectedPaths);
            }
            // CEPIO remains public as a stable interoperability platform. Keep
            // proprietary Industry IQ / customer data private by path and PR review.
            if (context.payload.repository?.private === false) {
              const ipReview = section('IP / publication review');
              const selections = [...ipReview.matchAll(/^- \[[xX]\] \*\*(PUBLIC|PROTECTED|CUSTOMER CONFIDENTIAL)\b/gm)];
              if (selections.length !== 1) {
                core.setFailed('Select exactly one IP/publication classification for public CEPIO.');
              }
              const classification = selections[0]?.[1];
              if (classification === 'CUSTOMER CONFIDENTIAL') {
                core.setFailed('Customer-confidential assets are never eligible for public publication.');
              }

              // These paths are never expanded in the public repo. Removals are
              // explicitly allowed after the private copy and CI checks succeed.
              const protectedIntelligence = /^(?:generalization\/(?:agents|benchmarks|competency|domain-packs|gaps|industry-iq|normalization|persona-bindings|personas|runtime)\/|mvp\/datasets\/|profiles\/|src\/cepio\/(?:agent_retrieval|compiled_iq_runtime|cross_customer_qualification|drilling_npt_iq|drilling_operator_well_delivery_iq|drilling_rig_readiness_iq|formation_evaluation|generalization|icc_qualification|industry_performance_packs|maintenance_deferral_skill|operational_assurance|operator_agent|performance_business_logic|performance_industry_iq|petrophysics_v1|qualification_assurance|runtime_coverage)\.py$)/;
              const forbidden = files
                .filter(file => file.status !== 'removed')
                .flatMap(file => [file.filename, file.previous_filename].filter(Boolean))
                .filter(path => protectedIntelligence.test(path));
              if (forbidden.length) {
                core.setFailed('Protected Industry IQ/customer material must be developed in Labs or a customer-controlled boundary. Public PRs may only REMOVE protected-path assets after tested migration.');
                core.summary.addHeading('Blocked IP paths').addList([...new Set(forbidden)]);
              }

              const nonDocumentationChange = files.some(file =>
                file.status !== 'removed' && !/^(?:docs\/|\.github\/|README\.md$|RELEASE\.md$|THIRD_PARTY_NOTICES\.md$)/.test(file.filename)
              );
              if (nonDocumentationChange) {
                const attestations = [
                  /^- \[[xX]\] No customer-confidential data,/m,
                  /^- \[[xX]\] No protected benchmark\/evaluation corpus/m,
                  /^- \[[xX]\] I considered whether the same ecosystem value/m,
                  /^- \[[xX]\] Publication value exceeds replication\/IP-exposure risk\./m
                ];
                for (const claim of attestations) {
                  if (!claim.test(ipReview)) core.setFailed('Public code changes require all four publication-safety attestations.');
                }
              }
            }
            await core.summary.write();
