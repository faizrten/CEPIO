name: CEPIO Fabric Live Binding Proof

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  live-proof:
    if: ${{ vars.FABRIC_LIVE_PROOF_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: dev
    env:
      CEPIO_FABRIC_SQL_SERVER: ${{ vars.CEPIO_FABRIC_SQL_SERVER }}
      CEPIO_FABRIC_SQL_DATABASE: ${{ vars.CEPIO_FABRIC_SQL_DATABASE }}
      CEPIO_FABRIC_SQL_AUTH: ActiveDirectoryDefault
      CEPIO_FABRIC_DATASET_ID: ${{ vars.CEPIO_FABRIC_DATASET_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Azure login via OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install CEPIO live Fabric SQL transport
        run: python -m pip install -e '.[fabric-sql]'

      - name: Run provider portability proof
        run: |
          set -euo pipefail
          python scripts/qualify_fabric_drilling_npt_live.py \
            --reference examples/fabric/drilling-npt/reference-context.json \
            > /tmp/fabric-live-proof.json
          cat /tmp/fabric-live-proof.json

      - name: Publish proof summary
        shell: bash
        run: |
          {
            echo '## CEPIO Fabric Live Binding Proof'
            echo
            echo "- Binding contract: \`$(jq -r '.binding_contract_version' /tmp/fabric-live-proof.json)\`"
            echo "- Provider: \`$(jq -r '.provider_id' /tmp/fabric-live-proof.json)\`"
            echo "- Context: \`$(jq -r '.context_id' /tmp/fabric-live-proof.json)\`"
            echo "- Semantic signature: \`$(jq -r '.semantic_signature' /tmp/fabric-live-proof.json)\`"
            echo "- NPT hours: \`$(jq -r '.total_npt_hours' /tmp/fabric-live-proof.json)\`"
            echo '- Result: **Synthetic/Fabric semantic parity PASS**'
          } >> "$GITHUB_STEP_SUMMARY"
