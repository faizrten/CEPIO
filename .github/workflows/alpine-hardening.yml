name: CEPIO Alpine Hardening Checks
on:
  push:
    branches: [security/base-image-evaluation]
    paths: ['experiments/alpine-hardening/**', '.github/workflows/alpine-hardening.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        variant: [default, integrations]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check final hardened runtime without cloud credentials
        run: python3 experiments/alpine-hardening/check.py ${{ matrix.variant }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpine-hardening-${{ matrix.variant }}-${{ github.run_id }}
          path: evidence/alpine-hardening/${{ matrix.variant }}/
          if-no-files-found: error
          retention-days: 30
