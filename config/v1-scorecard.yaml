schema_version: "1.0"
scorecard_version: "1.0.0"
product: CEPIO
target_release: v1.0
canonical: true
north_star: >-
  CEPIO is the portable industrial operating intelligence layer for Energy & Process
  Industries: thin in infrastructure, thick in industrial intelligence.
  Collective industrial progress; sovereign enterprise intelligence: reusable industrial
  competence compounds through authorized sources and qualification while customer
  operational knowledge remains customer-controlled.
scoring:
  total_points: 100
  baseline_date: "2026-10-20"
  baseline_commit: "a179e9cfc0dbf5e866a6a6aa143eb4290e79918d"
  baseline_points: 69
  governance_document: "docs/governance/v1-scorecard-governance.md"
  rules:
    - id: exact-100
      text: The scorecard always contains exactly 100 available points.
    - id: evidence-required
      text: Every earned point requires explicit independently verifiable evidence.
    - id: merged-evidence-only
      text: Open pull requests may be referenced as progress evidence but cannot contribute earned points.
    - id: partial-credit
      text: Partial credit is allowed only for independently verifiable sub-capabilities with an explicit credit basis.
    - id: release-gate-independence
      text: Product release qualification remains independent of this maturity score.
    - id: no-infrastructure-padding
      text: Generic infrastructure earns points only when required by a concrete CEPIO operating-intelligence contract or enterprise proof.
    - id: score-regression
      text: Invalidated or regressed evidence must reduce the score through a governed pull request.
    - id: public-boundary
      text: Customer-confidential and protected Industry IQ details must not be copied into the public scorecard.
