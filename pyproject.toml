[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cepio"
dynamic = ["version"]
description = "Common Energy & Process Industry Ontology operational runtime"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.8",
  "rdflib>=7.0",
  "PyYAML>=6.0",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "PyJWT[crypto]>=2.9",
  "networkx>=3.5",
  "numpy>=1.26",
  "scipy>=1.13"
]

[project.scripts]
cepio-management = "cepio.management_api:main"

[project.optional-dependencies]
mcp = ["mcp>=2.0,<3"]
otel = ["opentelemetry-api>=1.27,<2"]
dev = ["pytest>=8.0", "pyshacl>=0.30", "mcp>=2.0,<3", "build>=1.2"]

[tool.setuptools.dynamic]
version = {attr = "cepio._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
  "error",
  'ignore:^Dataset\.default_context is deprecated, use Dataset\.default_graph instead\.$:DeprecationWarning:rdflib\.graph$'
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
show_error_codes = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
  "cepio.adapters",
  "cepio.model",
  "cepio.platform_bindings",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["cepio.domain_bindings"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_return_any = true

[tool.coverage.run]
source = ["cepio"]
relative_files = true

[tool.coverage.report]
show_missing = true
