[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cepio"
dynamic = ["version"]
description = "Common Energy & Process Industry Ontology operational runtime"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.8",
  "rdflib>=7.0",
  "PyYAML>=6.0",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "PyJWT[crypto]>=2.9",
  "networkx>=3.5",
  "numpy>=1.26",
  "scipy>=1.13"
]

[project.optional-dependencies]
mcp = ["mcp>=2.0,<3"]
otel = ["opentelemetry-api>=1.27,<2"]
dev = ["pytest>=8.0", "pyshacl>=0.30", "mcp>=2.0,<3", "build>=1.2"]

[tool.setuptools.dynamic]
version = {attr = "cepio._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
