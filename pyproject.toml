[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cepio"
version = "0.2.0"
description = "Common Energy & Process Industry Ontology operational runtime"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.8",
  "rdflib>=7.0",
  "PyYAML>=6.0",
  "uvicorn>=0.30",
  "httpx>=0.27"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyshacl>=0.30"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
